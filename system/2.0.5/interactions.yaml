      triggers:
        - { kind: api, via: rest, ref: runSlam, actor: "human:floor-associate" }
      purpose: "Analytics copy of PackageManifested for the throughput read model and the data platform."
      criticality: best-effort
      onFailure: "outbox-retry"
  # NOT DECLARED: com.warehouse.wes.fulfillment-execution.task.ItemPicked on
  # warehouse.fulfillment.analytics. It is in apis/asyncapi.yaml and the analytics
  # encoder, but no use case raises it at v2.0.5 (shared.NewItemPicked has no
  # caller; features/task_pool_rules.feature, ADR 0040 and ADR 0041 record "ItemPicked
  # is defined but never raised"). The builder's coverage rule still demands an
  # interaction for it; none can be declared without inventing a use case.

subscriptions:
  - id: consume-wes-work-planning-work-released
    operation:
      asset: wes-work-planning/asyncapi    # pinned: internal/adapters/inbound/kafka/testdata/wes-work-planning.asyncapi.yaml
      id: consumeWorkPlanningEvents
      consumerOperation: receiveWorkReleased   # this repo's apis/asyncapi.yaml
      event:
        channel: warehouse.work-planning.events
        types:
          - com.warehouse.wes.work-planning.workunit.WorkReleased
    business:
      capability: execution.task-pool
      process: task-creation
      useCases: [ApplyWorkReleased]
      purpose: "Create one Task per released work unit (deduplicated on the CloudEvents id) so it can be pulled by a station."
  - id: consume-process-path-management-process-path-events
    operation:
      asset: process-path-management/asyncapi    # pinned: internal/adapters/outbound/kafkacatalog/testdata/process-path-management.asyncapi.yaml
      id: publishProcessPathEvents
      consumerOperation: receiveProcessPathEvents   # this repo's apis/asyncapi.yaml
      event:
        channel: warehouse.process-path-management.events
        types:
          - com.warehouse.wes.process-path-management.processpath.ProcessPathCreated
          - com.warehouse.wes.process-path-management.processpath.ProcessPathUpdated
          - com.warehouse.wes.process-path-management.processpath.ProcessPathDeactivated
    business:
      capability: execution.process-path-catalogue
      process: task-creation
      projection: PathCatalogue              # pure read model, only when PATH_CATALOGUE_SOURCE=kafka (ADR-0017)
      purpose: "Keep the in-memory process-path catalogue a released work unit's path id is resolved against."
  - id: consume-product-master-product-events
    operation:
      asset: product-master/asyncapi    # pinned: internal/adapters/inbound/kafka/testdata/product-master.asyncapi.yaml
      id: receiveProductEvents
      consumerOperation: receiveProductClassified   # this repo's apis/asyncapi.yaml
      event:
        channel: warehouse.product-master.events
        types:
          - com.warehouse.wms.product-master.product.ProductClassified
          - com.warehouse.wms.product-master.product.ProductPackLevelDeclared
          - com.warehouse.wms.product-master.product.ProductPackLevelRetired
    business:
      capability: execution.product-reference
      process: product-reference-sync
      useCases: [ApplyProductClassified, ApplyPackLevel]
      purpose: "Keep the local classification copy (DOT hazard check at SealPackage, ADR-0039) and the local PackView (GTIN resolution at pick scans, ADR-0054) current."
  - id: consume-task-interleaving-interleaving-hint-issued
    operation:
      asset: task-interleaving/asyncapi    # pinned: internal/adapters/inbound/kafka/testdata/task-interleaving.asyncapi.yaml
      id: receiveInterleavingHints
      consumerOperation: receiveInterleavingHintIssued   # this repo's apis/asyncapi.yaml
      event:
        channel: warehouse.task-interleaving.events
        types:
          - com.warehouse.wes.task-interleaving.stationtrip.InterleavingHintIssued
    business:
      capability: execution.task-claiming
      process: task-claiming
      useCases: [ApplyInterleavingHint]
      purpose: "Keep one active advisory hint per station that claimNext uses only as a tie-break inside a priority band (ADR-0051)."

# In the spec but raised by no code path at this release (checked: shared.NewItemPicked has no caller;
# features/task_pool_rules.feature and ADRs 0040/0041 say "defined but never raised").
declaredNotRaised:
  - channel: warehouse.fulfillment.analytics
    type: com.warehouse.wes.fulfillment-execution.task.ItemPicked
    reason: declared in apis/asyncapi.yaml and the analytics encoder, but no use case raises it at v2.0.5 (shared.NewItemPicked has no caller)
