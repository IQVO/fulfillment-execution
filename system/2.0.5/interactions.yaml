# fulfillment-execution 2.0.5 (v2.0.5, 9019d1d) - System Assets & Interaction Standard v0.4
# Interactions of fulfillment-execution (STANDARD.md Part B): every call this
# context MAKES (technology + operation + business) and every event it consumes.
#
# Outbound calls (3, one per distinct use case + producer operation):
#   rest facility-layout  GET  /locations/{locationCode}        (RegisterStation, ADR-0024)
#   rest inventory-storage POST /containers/{lpn}/case-breaks   (CompleteCaseBreak, ADR-0054)
#   a2a  wes-work-planning skill release_next_work              (RequestNextWork, ADR-0058)
# Published events go through the transactional outbox (ADR-0020) to the
# integration channel warehouse.fulfillment.events and, for analytics, to
# warehouse.fulfillment.analytics.
apiVersion: warehouse/interactions/v1
application: application.yaml

interactions:
  # --- RegisterStation: outbound REST to facility-layout
  - id: register-station-call-get-location-slot
    technology: rest
    operation:
      asset: facility-layout/openapi
      id: getLocationSlot
      effect: read
      rest: { method: GET, path: "/locations/{locationCode}" }
    business:
      capability: execution.station-registry
      process: station-registration
      useCase: RegisterStation
      triggers:
        - { kind: api, via: rest, ref: registerStation, actor: "human:floor-supervisor" }
      purpose: "Resolve the station's locationCode to its facility-layout role so a station standing outside a WorkCenter is rejected (LOCATION_ROLE_MODE=http only)."
      criticality: degradable
      onFailure: "registration proceeds with the locationCode recorded unchecked (fail-open; circuit breaker and retry)"
  # --- CompleteCaseBreak: outbound REST to inventory-storage
  - id: complete-case-break-call-break-case
    technology: rest
    operation:
      asset: inventory-storage/openapi
      id: breakCase
      effect: write
      rest: { method: POST, path: "/containers/{lpn}/case-breaks" }
    business:
      capability: execution.case-break
      process: case-break-completion
      useCase: CompleteCaseBreak
      triggers:
        - { kind: api, via: rest, ref: completeCaseBreak, actor: "human:floor-associate" }
      purpose: "Ask inventory-storage to break the sealed case into the loose bin (Idempotency-Key per task) before the BREAK_CASE Task is completed."
      criticality: blocking
      onFailure: "the Task stays Claimed and unchanged; a retry reuses the same idempotency key"
  # --- RequestNextWork: outbound A2A to wes-work-planning
  - id: request-next-work-call-release-next-work
    technology: a2a
    operation:
      asset: wes-work-planning/a2a
      id: release_next_work
      effect: write
      a2a: { method: SendMessage }
    business:
      capability: execution.work-request
      process: work-request
      useCase: RequestNextWork
      triggers:
        - { kind: api, via: rest, ref: requestNextWork, actor: "human:floor-supervisor" }
      purpose: "Delegate to Work Planning 'admit the next unit for this process path' when the claimable queue drains; the released work still arrives as the WorkReleased CloudEvent."
      criticality: blocking
      onFailure: "the request is answered 502 (peer unreachable), 404 (unknown path) or 503 (delegation not configured) and no work is released"
  # --- CreateTask
  - id: create-task-publish-task-available
    technology: event.publish
    operation:
      asset: fulfillment-execution/asyncapi
      id: consumeFulfillmentIntegrationEvents
      effect: write
      event: { channel: warehouse.fulfillment.events, type: com.warehouse.wes.fulfillment-execution.task.TaskAvailable }
    business:
      capability: execution.task-pool
      process: task-creation
      useCase: CreateTask
      triggers:
        - { kind: api, via: rest, ref: createTask, actor: "human:floor-supervisor" }
        - { kind: api, via: rest, ref: arriveAtRebin, actor: "human:floor-associate" }
        - { kind: event, ref: com.warehouse.wes.work-planning.workunit.WorkReleased, actor: system }
      purpose: "Announce that a Task entered the pool and can be claimed by a station."
      criticality: best-effort
      onFailure: "outbox-retry"
  - id: create-task-publish-task-created-analytics
