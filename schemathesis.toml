# Schemathesis configuration for scripts/contract-test.sh (passed explicitly
# via --config-file, so discovery quirks in git worktrees don't matter).
#
# Per-operation overrides only — every check stays enabled for every
# operation; an override here may only widen the set of statuses a check
# accepts for ONE operation, and each one must name the unexpressible
# semantic that justifies it plus where that semantic is tested instead.

# arriveAtRebin (POST /rebin/arrivals): a schema-valid body is correctly
# rejected with 422 rebin-unknown-line when lineId is not a member of the
# order's required line set — a cross-field rule (lineId ∈ requiredLineIds,
# or ∈ the set fixed by the FIRST arrival for orderRef) that OpenAPI 3.0.3
# cannot express. The 422 is documented on the operation. Tested by
# TestPostArriveAtRebin_UnknownLine_Returns422
# (internal/adapters/inbound/http/handlers_test.go) and the
# consolidation.RecordArrival unit tests. Default positive_data_acceptance
# statuses plus 422; status-code / response-schema conformance, negative
# data rejection and not_a_server_error still run unchanged.
[[operations]]
include-operation-id = "arriveAtRebin"
checks.positive_data_acceptance.expected-statuses = ["2xx", "401", "403", "404", "409", "422", "429", "5xx"]

# completeTask (POST /tasks/{id}/completions): the optional quantity / fromBin /
# toBin are valid only for a RELOCATE or REPLENISH task, and for that task they
# must match the stored planned move (ADR 0047, ADR 0050). A schema-valid body
# is therefore correctly rejected with 422 not-relocation-task (inputs on a
# PICK task), relocation-confirmation-required / replenishment-confirmation-
# required (a RELOCATE / REPLENISH task without them) or
# invalid-relocation-confirmation / invalid-replenishment-confirmation (a scan
# that differs from the plan). These
# rules depend on the task's stored type and move, which OpenAPI 3.0.3 cannot
# express. The 422 is documented on the operation. Tested by
# internal/adapters/inbound/http/relocate_test.go
# (TestRelocate_CompletionRejections, TestRelocate_InputsOnANonRelocateTaskAre422),
# internal/adapters/inbound/http/replenish_test.go
# (TestReplenish_CompletionRejections)
# and the task.CompleteRelocation / task.CompleteReplenishment unit tests. Default positive_data_acceptance
# statuses plus 422; status-code / response-schema conformance, negative data
# rejection and not_a_server_error still run unchanged.
[[operations]]
include-operation-id = "completeTask"
checks.positive_data_acceptance.expected-statuses = ["2xx", "401", "403", "404", "409", "422", "429", "5xx"]

# confirmPickScan (POST /tasks/{id}/scans): the Idempotency-Key (ADR 0055) is
# a cross-request rule. A schema-valid request that reuses a key already seen
# with a different body or on another task is correctly rejected with 422
# idempotency-key-reused, which OpenAPI 3.0.3 cannot express (it depends on
# the earlier requests). The 422 is documented on the operation. Tested by
# TestScanIdempotency_* (internal/adapters/inbound/http/scan_idempotency_integration_test.go).
# Default positive_data_acceptance statuses plus 422; every other check runs
# unchanged.
[[operations]]
include-operation-id = "confirmPickScan"
checks.positive_data_acceptance.expected-statuses = ["2xx", "401", "403", "404", "409", "422", "429", "5xx"]

# requestNextWork (POST /paths/{pathId}/work-requests): answers 503
# work-planning-not-configured whenever this deployment has no
# WORK_PLANNING_A2A_URL (ADR-0058) — an environment condition the contract
# runner cannot see and OpenAPI cannot express; the 503 is documented on the
# operation. The status mapping (including 503 not-configured, 502
# unreachable, 409 business rule) is tested by
# TestPostWorkRequest_ProblemStatuses
# (internal/adapters/inbound/http/work_request_test.go); the delegation wire
# itself by internal/adapters/outbound/a2a/client_test.go against a real
# stub agent. status-code / response-schema conformance and negative data
# rejection still run unchanged.
[[operations]]
include-operation-id = "requestNextWork"
checks.not_a_server_error.expected-statuses = ["2xx", "4xx", "5xx"]
checks.positive_data_acceptance.expected-statuses = ["2xx", "4xx", "5xx"]
