# Copy of what warehouse-infra renders for fulfillment-execution, kept here so
# charts/fulfillment-execution/tests/render_test.sh proves the chart still
# renders, and still provides every variable the binaries require, with the
# values the cluster really passes. It is the merge of, in ArgoCD precedence
# order, warehouse-infra origin/develop:
#
#   helm-values/_platform.yaml                      (kafka.brokers, gateway)
#   helm-values/fulfillment-execution.yaml          (the application)
#   helm-values/kind-resources/fulfillment-execution.yaml  (CPU requests only; omitted)
#
# Refresh it when warehouse-infra changes those files. Keep the deliberately
# stale-looking entries (kafka.enabled, readinessProbe on /healthz, the
# PRODUCT_CLASSIFICATION_* and TASK_INTERLEAVING_* extraEnv entries): the test
# exists to catch a chart change that breaks them.
replicaCount: 1

gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/fulfillment-execution
      pathType: PathPrefix
  stripPath: true

kafka:
  # No longer read by the chart (Kafka is not optional); harmless, and kept
  # because warehouse-infra still sets it.
  enabled: true
  brokers: kafka.warehouse-systems.svc.cluster.local:9092

config:
  httpAddr: ":8080"
  eventPublisher: "kafka"

analytics:
  enabled: true
  database:
    existingSecret: fulfillment-execution-analytics-db
  reports:
    route:
      enabled: true
      path: /api/fulfillment-execution/reports
      parentRefs:
        - name: warehouse-gateway
          namespace: kong
          sectionName: http

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6

database:
  existingSecret: fulfillment-execution-db

extraEnv:
  - name: PATH_CATALOGUE_SOURCE
    value: kafka
  - name: PRODUCT_CLASSIFICATION_MODE
    value: kafka
  - name: PRODUCT_CLASSIFICATION_CONSUMER_GROUP
    value: fulfillment-execution-product-classification
  - name: LOCATION_ROLE_MODE
    value: http
  - name: FACILITY_LAYOUT_BASE_URL
    value: http://facility-layout.warehouse-systems.svc.cluster.local:80
  - name: TASK_INTERLEAVING_MODE
    value: kafka
  - name: TASK_INTERLEAVING_CONSUMER_GROUP
    value: fulfillment-execution-interleaving
  - name: PACK_VIEW_CONSUMER_GROUP
    value: fulfillment-execution-pack-view
  - name: INVENTORY_STORAGE_BASE_URL
    value: http://inventory-storage.warehouse-systems.svc.cluster.local:80

frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/fulfillment-execution-frontend
image:
  pullPolicy: IfNotPresent
  repository: warehouse/fulfillment-execution
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/fulfillment-execution
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
    origin: http://localhost
  opentelemetry:
    enabled: true
    tracesEndpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  prometheus:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/fulfillment-execution
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
pathCatalogue:
  content: ''
  enabled: false
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
