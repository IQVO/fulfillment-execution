apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fulfillment-execution.fullname" . }}
  labels:
    {{- include "fulfillment-execution.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fulfillment-execution.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.pathCatalogue.enabled }}
        checksum/path-catalogue: {{ .Values.pathCatalogue.content | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fulfillment-execution.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fulfillment-execution.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # D14 (2026-10-12): the chart ConfigMap (HTTP_ADDR, EVENT_PUBLISHER,
          # OUTBOX_MAX_ATTEMPTS, KAFKA_BROKERS and, with otel.enabled, the
          # OTEL_*/ENVIRONMENT keys) was rendered but mounted by no Deployment.
          # Every key in it is read by cmd/execution, so this Deployment mounts
          # it with envFrom. The explicit `env` entries below win over envFrom
          # for the same key and carry the same values; the checksum/config
          # annotation rolls the pods when the ConfigMap changes. Only this
          # Deployment mounts it: HTTP_ADDR is the API's listen address and
          # OTEL_SERVICE_NAME is the API's service name.
          envFrom:
            - configMapRef:
                name: {{ include "fulfillment-execution.fullname" . }}
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            # Outbox relay attempt cap (gap fix D12, ADR-0042).
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.config.outboxMaxAttempts | quote }}
            # KAFKA_BROKERS is always set and required: Postgres and Kafka are
            # the only runtime (ADR 0052), so the render fails when it is empty.
            - name: KAFKA_BROKERS
              value: {{ required "kafka.brokers is required: every binary of this chart runs on a real Kafka" .Values.kafka.brokers | quote }}
            # One stable consumer group per Kafka consumer; a missing one is a
            # boot error. extraEnv wins: warehouse-infra sets the
            # classification and interleaving groups there and a duplicate env
            # entry breaks ArgoCD's diff, so the chart default is rendered
            # only when extraEnv does not name the variable.
            {{- $extra := dict }}
            {{- range .Values.extraEnv }}
            {{- $_ := set $extra .name true }}
            {{- end }}
            - name: WORK_RELEASED_CONSUMER_GROUP
              value: {{ required "config.workReleasedConsumerGroup is required" .Values.config.workReleasedConsumerGroup | quote }}
            {{- if not (hasKey $extra "PRODUCT_CLASSIFICATION_CONSUMER_GROUP") }}
            - name: PRODUCT_CLASSIFICATION_CONSUMER_GROUP
              value: {{ required "config.productClassificationConsumerGroup is required" .Values.config.productClassificationConsumerGroup | quote }}
            {{- end }}
            {{- if not (hasKey $extra "TASK_INTERLEAVING_CONSUMER_GROUP") }}
            - name: TASK_INTERLEAVING_CONSUMER_GROUP
              value: {{ required "config.taskInterleavingConsumerGroup is required" .Values.config.taskInterleavingConsumerGroup | quote }}
            {{- end }}
            {{- include "fulfillment-execution.requireDatabase" . }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fulfillment-execution.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and ADR-0031: a direct (non-pooled) connection used only for
            # the migration step below, never for the runtime pgxpool.
            # `optional: true` so a secret without this key yet (predates
            # this chart version) still starts the pod -- the binary falls
            # back to DATABASE_URL itself when this env var is unset.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fulfillment-execution.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- if .Values.pathCatalogue.enabled }}
            - name: PATH_CATALOGUE_FILE
              value: {{ .Values.pathCatalogue.mountPath }}/process-paths.yaml
            {{- end }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- if .Values.pathCatalogue.enabled }}
          volumeMounts:
            - name: path-catalogue
              mountPath: {{ .Values.pathCatalogue.mountPath }}
              readOnly: true
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.pathCatalogue.enabled }}
      volumes:
        - name: path-catalogue
          configMap:
            name: {{ .Values.pathCatalogue.existingConfigMap | default (printf "%s-path-catalogue" (include "fulfillment-execution.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
