apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fulfillment-execution.fullname" . }}
  labels:
    {{- include "fulfillment-execution.labels" . | nindent 4 }}
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  KAFKA_BROKERS: {{ required "kafka.brokers is required: every binary of this chart runs on a real Kafka" .Values.kafka.brokers | quote }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  ENVIRONMENT: {{ .Values.environment | quote }}
  {{- end }}
