{{- /*
Scheduler for the two REST-triggered sweeps (ADR-0003, ADR-0025, ADR-0037):
nothing in this service calls POST /task-lease-expirations or
POST /cpt-miss-sweeps on a timer, by design -- a Kubernetes CronJob is
the external scheduler ADR-0003 names. ON by default (sweeps.enabled=true,
ADR-0037); set it false when an external caller drives the endpoints. No
in-process ticker is added (ADR-0025 rejected one).

The Job reuses the service's own image and runs its /app/sweep entrypoint
(cmd/sweep, ADR 0048), which POSTs an empty body to the in-cluster Service.
The two handlers read no body and require no Content-Type (PostExpireLeases /
PostSweepCPTMisses in internal/adapters/inbound/http/handlers.go), and neither
route sits behind the Idempotency-Key middleware (ADR-0028 covers POST /tasks
only). Fail fast (ADR 0048): each attempt is bounded by
sweeps.requestTimeoutSeconds, transient failures (connect/timeout, 429, 5xx)
are retried up to sweeps.maxAttempts with doubling backoff capped at
sweeps.maxBackoffSeconds, a give-up exits non-zero (the Job fails with logs),
and the Istio sidecar quit (sweeps.sidecarQuitUrl) is POSTed on EVERY exit
path. The render fails when the worst-case retry budget does not fit inside
activeDeadlineSeconds, so a values change can not reintroduce the hang.
*/ -}}
{{- if .Values.sweeps.enabled }}
{{- $root := . }}
{{- $s := .Values.sweeps }}
{{- $budget := add (mul (int $s.maxAttempts) (int $s.requestTimeoutSeconds)) (mul (sub (int $s.maxAttempts) 1) (int $s.maxBackoffSeconds)) }}
{{- if ge (int $budget) (int $s.activeDeadlineSeconds) }}
{{- fail (printf "sweeps: worst-case retry budget %ds (maxAttempts x requestTimeoutSeconds + (maxAttempts-1) x maxBackoffSeconds) must be below activeDeadlineSeconds %ds (ADR 0048)" (int $budget) (int $s.activeDeadlineSeconds)) }}
{{- end }}
{{- $jobs := dict "expire-leases" .Values.sweeps.expireLeases "sweep-cpt-misses" .Values.sweeps.cptMisses }}
{{- $paths := dict "expire-leases" "task-lease-expirations" "sweep-cpt-misses" "cpt-miss-sweeps" }}
{{- range $name, $job := $jobs }}
{{- if $job.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-%s" (include "fulfillment-execution.fullname" $root) $name | trunc 52 | trimSuffix "-" }}
  labels:
    {{- include "fulfillment-execution.labels" $root | nindent 4 }}
    app.kubernetes.io/component: sweep-{{ $name | trimPrefix "sweep-" }}
spec:
  schedule: {{ $job.schedule | quote }}
  # Never overlap two passes of the same sweep: they are idempotent, but a
  # second concurrent pass would only repeat the work (and, for
  # sweep-cpt-misses, re-publish TaskCPTMissed for the same tasks).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $root.Values.sweeps.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ $root.Values.sweeps.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $root.Values.sweeps.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ $root.Values.sweeps.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "fulfillment-execution.selectorLabels" $root | nindent 12 }}
            app.kubernetes.io/component: sweep-{{ $name | trimPrefix "sweep-" }}
        spec:
          restartPolicy: Never
          {{- with $root.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "fulfillment-execution.serviceAccountName" $root }}
          securityContext:
            {{- toYaml $root.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: sweep
              securityContext:
                {{- toYaml $root.Values.securityContext | nindent 16 }}
              image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag | default $root.Chart.AppVersion }}"
              imagePullPolicy: {{ $root.Values.image.pullPolicy }}
              command:
                - /app/sweep
              env:
                - name: SWEEP_URL
                  value: {{ printf "http://%s:%v/%s" (include "fulfillment-execution.fullname" $root) $root.Values.service.port (index $paths $name) | quote }}
                - name: SWEEP_REQUEST_TIMEOUT
                  value: {{ printf "%ds" (int $s.requestTimeoutSeconds) | quote }}
                - name: SWEEP_MAX_ATTEMPTS
                  value: {{ $s.maxAttempts | quote }}
                - name: SWEEP_RETRY_BACKOFF
                  value: {{ printf "%ds" (int $s.retryBackoffSeconds) | quote }}
                - name: SWEEP_MAX_BACKOFF
                  value: {{ printf "%ds" (int $s.maxBackoffSeconds) | quote }}
                - name: SIDECAR_QUIT_URL
                  value: {{ $s.sidecarQuitUrl | default "" | quote }}
              resources:
                {{- toYaml $root.Values.sweeps.resources | nindent 16 }}
          {{- with $root.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
