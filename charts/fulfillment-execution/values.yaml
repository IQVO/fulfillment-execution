# Default values for fulfillment-execution.

replicaCount: 1

image:
  repository: fulfillment-execution
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fulfillment-execution.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

config:
  httpAddr: ":8080"
  eventPublisher: "log"   # "log" or "kafka" — gates the TaskCompleted publisher only

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# IMPORTANT: unlike the other three services, this one's inbound Kafka
# consumer (WorkReleased -> CreateTask) starts UNCONDITIONALLY at boot and
# always needs a reachable KAFKA_BROKERS value (the binary defaults to
# localhost:9092 if unset, which is never correct inside a cluster). Keep
# kafka.brokers pointed at a real broker even if kafka.enabled (the outbound
# TaskCompleted publisher toggle) is false.
kafka:
  enabled: false
  brokers: "kafka:9092"

# Deployment environment, exported as the deployment.environment.name
# resource attribute on every span and metric.
environment: "local"

# OpenTelemetry. Traces and metrics are PUSHED over OTLP/gRPC to a Collector;
# the service never exposes a Prometheus scrape endpoint of its own. An
# unreachable endpoint is not fatal -- the exporters dial lazily, so the pod
# still starts and serves, it just drops telemetry.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "fulfillment-execution"

extraEnv: []

# ---------------------------------------------------------------------------
# Process-path catalogue (ADR-0017): a boot-time-required file this binary
# reads via PATH_CATALOGUE_FILE. warehouse-infra owns the canonical content
# (config/process-paths/*.yaml is the fleet's published-language source of
# truth, shared verbatim with wes-work-planning and workforce-management) --
# this chart just knows how to mount whatever content it's given. A missing
# or empty pathCatalogue.content with pathCatalogue.enabled=true and no
# existingConfigMap will fail Helm's render, not the pod's boot -- the
# environment is expected to supply the real content via a values override.
# ---------------------------------------------------------------------------
pathCatalogue:
  enabled: true
  mountPath: "/etc/fulfillment-execution"
  # Raw YAML content of the catalogue file, indented as a multi-line block
  # scalar via the values override that sets it (e.g. --set-file or a
  # values.yaml `content: |` block). Ignored when existingConfigMap is set.
  content: ""
  # Name of a pre-existing ConfigMap with a "process-paths.yaml" data key,
  # for environments that manage the catalogue ConfigMap outside this chart.
  # When set, content above is ignored and no ConfigMap is created here.
  existingConfigMap: ""

# startupProbe covers this fleet's known ~10s post-start first-outbound-dial
# reset (Istio native sidecars; holdApplicationUntilProxyStarts is a no-op
# for them): failureThreshold * periodSeconds = 60s gives the app-side boot
# retry (internal/adapters/outbound/bootretry, ~31s worst case) room to
# finish before liveness/readiness probing (and any liveness-triggered
# restart) begins.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Analytics data product (ADR-0012). When enabled, deploys two extra
# workloads reading the dedicated analytics topic and a SEPARATE analytical
# database:
#   - projector: the ONLY writer of the analytical DB. Consumes
#     warehouse.fulfillment.analytics and applies idempotent projections.
#   - reports:   a READ-ONLY reader that serves GET /reports/... . It connects
#     with a read-only role and never writes.
# The OLTP deployment above is unchanged; it only additionally publishes to the
# analytics topic (handled in-process by the execution binary).
# ---------------------------------------------------------------------------
analytics:
  enabled: false

  # Analytical database DSNs. The analytics topic itself is a compile-time
  # constant in the binaries (warehouse.fulfillment.analytics), so it is not
  # configured here. Both binaries read the env var ANALYTICS_DATABASE_URL;
  # they are given SEPARATE secret values so the reader can use a read-only
  # role while the projector uses a read-write role. This database MUST be
  # different from the OLTP database.url above (ADR-0012).
  database:
    # Read-write DSN for the projector (the only writer).
    projectorUrl: ""
    # Read-only DSN for the reports reader. Falls back to projectorUrl when
    # empty (acceptable for local/dev; use a distinct read-only role otherwise).
    reportsUrl: ""
    # When set, both deployments read ANALYTICS_DATABASE_URL from this existing
    # secret instead of the chart-managed one (key below).
    existingSecret: ""
    existingSecretKey: "ANALYTICS_DATABASE_URL"

  # Path (in the image) to the analytical golang-migrate migrations the
  # projector runs on start.
  migrationsPath: "migrations/analytics"

  projector:
    replicaCount: 1
    adminAddr: ":8091"      # GET /healthz (ADMIN_ADDR)
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  reports:
    replicaCount: 1
    httpAddr: ":8080"       # GET /reports/... , /healthz (HTTP_ADDR)
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: fulfillment-reports.local
          paths:
            - path: /
              pathType: Prefix
      tls: []
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

# ---------------------------------------------------------------------------
# MCP server (ADR-0008). When enabled, deploys `cmd/mcp` — the Model Context
# Protocol inbound adapter — as its own Deployment + ClusterIP Service
# (`<release>-mcp`, port 8090). It runs the SAME read use cases over the SAME
# OLTP database as the main deployment (it reuses database.url /
# database.existingSecret), speaks MCP Streamable HTTP at both `/` and
# `/mcp`, and answers `GET /healthz` for the probes. This surface is
# unauthenticated.
# ---------------------------------------------------------------------------
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"       # MCP_ADDR — Streamable HTTP at / and /mcp, /healthz
  logLevel: "info"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Base URL of the fulfillment-reports REST service, which backs the
  # get_fulfillment_throughput_report tool. Empty means: derive it from the
  # chart's own reports Service when analytics.enabled is true, otherwise
  # leave the tool unregistered.
  reportsBaseUrl: ""
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# --- frontend (REMOTE Module Federation remote) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod. In the kind cluster it is reached through
# warehouse-infra's Nginx web gateway at http://localhost/mfes/fulfillment-execution/
# -- never through Kong, which serves APIs only and must never handle HTML,
# JavaScript, CSS, fonts or images.
#
# Deliberately NO ingress/httproute/gatewayApi block here: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/fulfillment-execution-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
