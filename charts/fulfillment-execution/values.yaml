# Default values for fulfillment-execution.

replicaCount: 1

image:
  repository: fulfillment-execution
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fulfillment-execution.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

# Kong plugins rendered by THIS chart (kong-plugins.yaml) and attached to
# every HTTPRoute above via the konghq.com/plugins annotation. Fleet
# decision 2026-10-13: Kong configuration belongs to the application
# charts, not warehouse-infra Terraform. Defaults off; warehouse-infra's
# values switch them on. NO auth plugin here, ever — the fleet's endpoints
# are unauthenticated and the gateway adds no authentication or
# authorization.
kongPlugins:
  cors:
    enabled: false
    # Exact browser origin, never "*" (endpoints are unauthenticated).
    origin: "http://localhost"
  prometheus:
    enabled: false
  opentelemetry:
    enabled: false
    # OTLP/HTTP traces endpoint of the fleet collector; needs Kong started
    # with KONG_TRACING_INSTRUMENTATIONS or the plugin exports zero spans.
    tracesEndpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) per independently-scalable
# workload type (ADR-0030, direct port of order-management ADR-0026). Every
# block below defaults `enabled: false` so this PR cannot silently change
# production replica behaviour on merge -- the fleet turns these on
# deliberately later, after this PR proves the shape is correct. When a
# component's autoscaling.<x>.enabled=true, that Deployment's own
# replicaCount / analytics.<x>.replicaCount value is OMITTED from the
# rendered manifest (see each deployment template's `{{- if not
# .Values.autoscaling.<x>.enabled }}` guard) so the HPA controller is the
# SOLE owner of .spec.replicas -- a hardcoded `replicas:` field competing
# with the HPA would otherwise fight it on every reconcile.
#
# mcp deliberately has NO block here (skipped, not just disabled): its
# StreamableHTTPHandler (github.com/modelcontextprotocol/go-sdk/mcp, see
# internal/adapters/inbound/mcp/server.go's mcp.NewStreamableHTTPHandler)
# keeps per-process, in-memory MCP session state keyed by the protocol's own
# Mcp-Session-Id header -- a real multi-request session, not just a TCP/HTTP
# connection. charts/fulfillment-execution/templates/mcp-service.yaml is a
# plain ClusterIP Service with no sessionAffinity configured, so a second
# replica could receive a mid-session request its own process never
# created, which has never heard of that session id and would reject or
# silently start a new one. Fixing it for real needs either
# sessionAffinity: ClientIP (a partial mitigation only) or wiring the SDK's
# StreamableHTTPOptions.EventStore to a shared/external session store -- a
# real code change, out of scope for this chart-and-pgxpool-tuning PR.
# mcp.replicaCount therefore stays a plain, manually-set value; see mcp:
# below.
autoscaling:
  # cmd/execution (this Deployment): stateless OLTP HTTP service, no
  # in-memory session state. Its inbound WorkReleased consumer
  # (internal/adapters/inbound/kafka/consumer.go, WORK_RELEASED_CONSUMER_GROUP
  # defaulting to "fulfillment-execution") uses a STABLE shared consumer
  # group -- the fleet's correctly-scalable pattern (N replicas share
  # partitions via normal Kafka group rebalancing, never a per-process-
  # unique group) -- so running multiple api replicas is safe. max 4 /
  # target 70% CPU per the plan, matching order-management's api HPA.
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # cmd/fulfillment-projector: kafka.AnalyticsConsumerGroup
  # ("fulfillment-analytics") is a STABLE, shared consumer-group name with
  # no per-instance uniqueness (internal/adapters/inbound/kafka/analytics_consumer.go)
  # -- the fleet's correctly-scalable convention -- so N replicas legitimately
  # share the analytics topic's partitions via normal Kafka rebalancing, not
  # a collision risk. Capped at 2, not left at api's 4: (a) the analytics
  # publisher partitions by the aggregate's own id
  # (internal/adapters/outbound/kafka/analytics_publisher.go's marshalData,
  # verified Key is always set), so ordering is only guaranteed per-
  # aggregate/per-partition, and a wider fan-out buys little extra
  # throughput for what is a lightweight idempotent-upsert workload; (b)
  # every write is already idempotent on event_id via the projection's own
  # claim() (analytics_processed_events, ON CONFLICT DO NOTHING) --
  # correctness does not regress at 2, but there is no throughput case yet
  # that justifies more. Matches order-management's projector HPA exactly.
  projector:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  # cmd/fulfillment-reports: stateless read-only REST reader over its own
  # read-only pgxpool (analyticsstore.NewReadOnlyPool) -- no in-memory
  # state, safe to run N independent copies of. max 3 / target 70% CPU,
  # same treatment as api.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # frontend (web/, nginx-unprivileged serving the built SPA bundle): pure
  # static-asset serving, no server-side session or per-request state
  # whatsoever -- the most trivially horizontally scalable workload in this
  # chart.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

config:
  httpAddr: ":8080"
  # EVENT_PUBLISHER. "kafka" is the ONLY accepted value (Postgres and Kafka
  # are the only runtime, ADR 0052): "log" and any other value fail the boot
  # naming the variable. Both outbox encoders (the integration topic and the
  # analytics topic), the always-on outbox relay and the WorkReleased
  # consumer's dead-letter (<topic>.dlq) writer run in every deployment.
  eventPublisher: "kafka"
  # Stable consumer group of the WorkReleased consumer
  # (WORK_RELEASED_CONSUMER_GROUP, REQUIRED by the binary: an empty value is a
  # boot error). The default is the group the binary used before the variable
  # became mandatory, so an upgrade keeps its committed offsets.
  workReleasedConsumerGroup: "fulfillment-execution"
  # The other two consumer groups. PRODUCT_CLASSIFICATION_CONSUMER_GROUP and
  # TASK_INTERLEAVING_CONSUMER_GROUP are REQUIRED by the binary too. The chart
  # renders these defaults ONLY when extraEnv does not already carry the same
  # name (warehouse-infra sets both through extraEnv, and a duplicate env
  # entry breaks ArgoCD's diff), so extraEnv wins and nothing is duplicated.
  productClassificationConsumerGroup: "fulfillment-execution-product-classification"
  taskInterleavingConsumerGroup: "fulfillment-execution-interleaving"
  # Outbox relay attempt cap (gap fix D12, ADR-0042); OUTBOX_MAX_ATTEMPTS. A row
  # that has failed this many sends is excluded from the relay's claims (it
  # stays in outbox_events with attempts/last_error, logged at ERROR) so one
  # poison row cannot stop the relay forever. 0 = unlimited. Re-arm a row with
  # UPDATE outbox_events SET attempts = 0 WHERE id = ... (runbook).
  outboxMaxAttempts: 20

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup
  # step (cmd/execution/main.go, cmd/mcp/main.go) -- never for the runtime
  # pgxpool, which always uses existingSecretKey/DATABASE_URL above,
  # unchanged. `optional: true` below so a secret that predates this key
  # (local dev, an environment whose Terraform hasn't been rolled yet)
  # still starts the pod: the Go binary's own
  # getenv("MIGRATIONS_DATABASE_URL", databaseURL) fallback then makes
  # migrations run against DATABASE_URL, exactly as before this key
  # existed. See ADR-0031 (and order-management's ADR-0029, the reference
  # implementation this mirrors) for the PgBouncer/pg_advisory_lock
  # incompatibility this key exists to route migrations around.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# Every binary of this chart requires a reachable broker (the WorkReleased,
# ProductClassified and InterleavingHintIssued consumers, the outbox relay,
# the DLQ writer, the MCP outbox writer, the analytics projector and /readyz
# all use it); there is no local default and no "disabled" switch, so
# KAFKA_BROKERS is always rendered and the render fails when kafka.brokers is
# empty. /readyz checks broker reachability only, never a topic.
kafka:
  brokers: "kafka:9092"

# Deployment environment, exported as the deployment.environment.name
# resource attribute on every span and metric.
environment: "local"

# OpenTelemetry. Traces and metrics are PUSHED over OTLP/gRPC to a Collector;
# the service never exposes a Prometheus scrape endpoint of its own. An
# unreachable endpoint is not fatal -- the exporters dial lazily, so the pod
# still starts and serves, it just drops telemetry.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "fulfillment-execution"

# Extra env for the execution container. Product classification (ADR-0039)
# and task-interleaving hints (ADR 0051) run only in kafka mode:
# PRODUCT_CLASSIFICATION_MODE / TASK_INTERLEAVING_MODE default to kafka,
# "permissive", "off" and PRODUCT_CLASSIFICATION_MODE=http fail the boot, and
# INVENTORY_STORAGE_BASE_URL is no longer read. The consumer groups come from
# config.* above unless an entry here names them first.
extraEnv: []

# ---------------------------------------------------------------------------
# Process-path catalogue (ADR-0017): a boot-time-required file this binary
# reads via PATH_CATALOGUE_FILE. warehouse-infra owns the canonical content
# (config/process-paths/*.yaml is the fleet's published-language source of
# truth, shared verbatim with wes-work-planning and workforce-management) --
# this chart just knows how to mount whatever content it's given. A missing
# or empty pathCatalogue.content with pathCatalogue.enabled=true and no
# existingConfigMap will fail Helm's render, not the pod's boot -- the
# environment is expected to supply the real content via a values override.
# ---------------------------------------------------------------------------
pathCatalogue:
  enabled: true
  mountPath: "/etc/fulfillment-execution"
  # Raw YAML content of the catalogue file, indented as a multi-line block
  # scalar via the values override that sets it (e.g. --set-file or a
  # values.yaml `content: |` block). Ignored when existingConfigMap is set.
  content: ""
  # Name of a pre-existing ConfigMap with a "process-paths.yaml" data key,
  # for environments that manage the catalogue ConfigMap outside this chart.
  # When set, content above is ignored and no ConfigMap is created here.
  existingConfigMap: ""

# ---------------------------------------------------------------------------
# Sweep scheduler (ADR-0003, ADR-0025, ADR-0037). POST /tasks/expire-leases
# and POST /tasks/sweep-cpt-misses have no in-process ticker by design; an
# external scheduler has to call them, and a Kubernetes CronJob is the one
# ADR-0003 names. ON by default (ADR-0037): without a scheduler leases are
# only freed lazily and stuck tasks are never reported as CPT-missed. Set
# sweeps.enabled=false when the endpoints are driven by an external caller
# instead. Each CronJob reuses the service image and POSTs to this release's
# own Service with the /app/sweep entrypoint (ADR 0048; an empty-body POST; the handlers read no
# body and require no Content-Type, and the sweeps take no Idempotency-Key).
#
# expire-leases (every minute) frees tasks whose lease has lapsed, so
# queue-depth is accurate and LeaseExpired is emitted within ~1 min; lazy
# expiry inside claim/renew/complete keeps correctness regardless.
# sweep-cpt-misses (every 5 minutes) re-publishes TaskCPTMissed for EVERY
# still-open overdue task on EVERY pass (ADR-0025 sec. 4), so its Kafka
# volume is (overdue tasks) x (passes): TaskCPTMissed volume scales with this
# cadence. Slow it down per environment if the overdue backlog is large.
#
# concurrencyPolicy is Forbid (not configurable): two passes of one sweep
# never overlap. startingDeadlineSeconds (60) < the 1-minute cadence, so a
# missed slot is skipped rather than piling up behind the next one.
# ---------------------------------------------------------------------------
sweeps:
  enabled: true
  startingDeadlineSeconds: 60
  activeDeadlineSeconds: 120
  # Fail fast (ADR 0048), read by the /app/sweep entrypoint: each POST is cut
  # after requestTimeoutSeconds; connect errors, timeouts, 429 and 5xx are
  # retried up to maxAttempts times with a backoff that starts at
  # retryBackoffSeconds and doubles up to maxBackoffSeconds; a give-up exits
  # non-zero so the Job FAILS (with logs) instead of hanging until
  # activeDeadlineSeconds. The worst case, maxAttempts x requestTimeoutSeconds
  # + (maxAttempts - 1) x maxBackoffSeconds (4 x 15 + 3 x 8 = 84 s), must stay
  # below activeDeadlineSeconds or the render fails.
  requestTimeoutSeconds: 15
  maxAttempts: 4
  retryBackoffSeconds: 1
  maxBackoffSeconds: 8
  # Istio sidecar quit endpoint, POSTed on EVERY exit path (success, give-up,
  # rejection, bad configuration) so the pod completes. Set "" outside a mesh.
  sidecarQuitUrl: "http://127.0.0.1:15020/quitquitquit"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  expireLeases:
    enabled: true
    schedule: "* * * * *"
  cptMisses:
    enabled: true
    schedule: "*/5 * * * *"
  resources:
    limits:
      cpu: 50m
      memory: 32Mi
    requests:
      cpu: 10m
      memory: 16Mi

# startupProbe covers this fleet's known ~10s post-start first-outbound-dial
# reset (Istio native sidecars; holdApplicationUntilProxyStarts is a no-op
# for them): failureThreshold * periodSeconds = 60s gives the app-side boot
# retry (internal/adapters/outbound/bootretry: 5 attempts, 1+2+4+8 = 15s of
# backoff plus the attempts' own duration) room to
# finish before liveness/readiness probing (and any liveness-triggered
# restart) begins. With PATH_CATALOGUE_SOURCE=kafka the process-path
# catalogue replay does NOT count against this budget: the listener (and so
# /healthz) is up before the replay; /readyz stays 503 until it catches up
# (ADR-0044).
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  # /readyz (not /healthz): it flips to 503 as the FIRST step of graceful
  # shutdown (ADR-0029) so the pod leaves the Service endpoints during the
  # drain window. /healthz stays on startup/liveness: it is always 200 while
  # the process is up.
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Analytics data product (ADR-0012). When enabled, deploys two extra
# workloads reading the dedicated analytics topic and a SEPARATE analytical
# database:
#   - projector: the ONLY writer of the analytical DB. Consumes
#     warehouse.fulfillment.analytics and applies idempotent projections.
#   - reports:   a READ-ONLY reader that serves GET /reports/... . It connects
#     with a read-only role and never writes.
# The OLTP deployment above is unchanged; it only additionally publishes to the
# analytics topic (handled in-process by the execution binary).
# ---------------------------------------------------------------------------
analytics:
  enabled: false

  # Analytical database DSNs. The analytics topic itself is a compile-time
  # constant in the binaries (warehouse.fulfillment.analytics), so it is not
  # configured here. Both binaries read the env var ANALYTICS_DATABASE_URL;
  # they are given SEPARATE secret values so the reader can use a read-only
  # role while the projector uses a read-write role. This database MUST be
  # different from the OLTP database.url above (ADR-0012).
  database:
    # Read-write DSN for the projector (the only writer).
    projectorUrl: ""
    # Read-only DSN for the reports reader. Falls back to projectorUrl when
    # empty (acceptable for local/dev; use a distinct read-only role otherwise).
    reportsUrl: ""
    # When set, both deployments read ANALYTICS_DATABASE_URL from this existing
    # secret instead of the chart-managed one (key below).
    existingSecret: ""
    existingSecretKey: "ANALYTICS_DATABASE_URL"

  # Path (in the image) to the analytical golang-migrate migrations the
  # projector runs on start.
  migrationsPath: "migrations/analytics"

  projector:
    replicaCount: 1
    adminAddr: ":8091"      # GET /healthz (ADMIN_ADDR)
    # HPA min 1 / max 2, NOT 4 -- see the top-level autoscaling.projector
    # block's comment (ADR-0030) for the full reasoning: stable shared
    # consumer group makes N>1 safe, capped at 2 because a wider fan-out
    # buys little for this lightweight idempotent-upsert workload.
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  reports:
    replicaCount: 1
    httpAddr: ":8080"       # GET /reports/... , /healthz (HTTP_ADDR)
    # Stateless read-only REST reader over the analytical database (its own
    # read-only pgxpool, analyticsstore.NewReadOnlyPool) -- no in-memory
    # state, safe to run N independent copies of. See the top-level
    # autoscaling.reports block (ADR-0030): max 3 / target 70% CPU.
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    # Kong exposure of the reports API (reports-route.yaml): host path
    # /api/<context>/reports rewritten to /reports. Off by default;
    # warehouse-infra turns it on with the real parentRefs and path.
    route:
      enabled: false
      path: "/api/fulfillment-execution/reports"
      parentRefs:
        - name: ""
          namespace: ""
          sectionName: "http"
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: fulfillment-reports.local
          paths:
            - path: /
              pathType: Prefix
      tls: []
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

# ---------------------------------------------------------------------------
# MCP server (ADR-0008). When enabled, deploys `cmd/mcp` — the Model Context
# Protocol inbound adapter — as its own Deployment + ClusterIP Service
# (`<release>-mcp`, port 8090). It runs the SAME read use cases over the SAME
# OLTP database as the main deployment (it reuses database.url /
# database.existingSecret), speaks MCP Streamable HTTP at both `/` and
# `/mcp`, and answers `GET /healthz` for the probes. This surface is
# unauthenticated.
#
# Deliberately NOT HPA-scalable (no autoscaling.mcp block exists in this
# chart, ADR-0030) — see the top-level autoscaling: block's comment for the
# full reasoning: internal/adapters/inbound/mcp/server.go's
# mcp.NewStreamableHTTPHandler keeps in-memory, per-process MCP session
# state keyed by Mcp-Session-Id, and this chart's mcp-service.yaml has no
# session affinity, so a second replica could receive a mid-session request
# its own process never created. replicaCount therefore stays a plain,
# manually-set value.
# ---------------------------------------------------------------------------
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"       # MCP_ADDR — Streamable HTTP at / and /mcp, /healthz
  logLevel: "info"
  # complete_task writes outbox_events rows that the main deployment's relay
  # publishes (ADR-0008, ADR-0020); EVENT_PUBLISHER is config.eventPublisher
  # (kafka, the only accepted value).
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Kong exposure of the MCP server (mcp-route.yaml): host path
  # /api/mcp/<context> rewritten to /mcp. Off by default; warehouse-infra
  # turns it on with the real parentRefs and path.
  route:
    enabled: false
    path: "/api/mcp/fulfillment-execution"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  # Base URL of the fulfillment-reports REST service, which backs the
  # get_fulfillment_throughput_report tool. Empty means: derive it from the
  # chart's own reports Service when analytics.enabled is true, otherwise
  # leave the tool unregistered.
  reportsBaseUrl: ""
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# --- frontend (REMOTE Module Federation remote) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod. In the kind cluster it is reached through
# warehouse-infra's Nginx web gateway at http://localhost/mfes/fulfillment-execution/
# -- never through Kong, which serves APIs only and must never handle HTML,
# JavaScript, CSS, fonts or images.
#
# Deliberately NO ingress/httproute/gatewayApi block here: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/fulfillment-execution-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
