    ProductClassified:
      name: ProductClassified
      title: ProductClassified
      summary: product-master set or replaced a SKU's handling classification (consumed).
      description: Published by product-master on `warehouse.product-master.events` (its AsyncAPI is the
        source of truth); consumed here into the local classification copy (ADR-0039). Full-state replacement
        of the classification; optional fields are omitted when unset. Applied only when `version` is greater
        than the stored version; dedupe on the CloudEvents `id`.
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wms.product-master.product.ProductClassified
            source:
              type: string
              const: /warehouse/product-master
            dataschema:
              type: string
              const: urn:warehouse:product-master:events:ProductClassified:v1
            data:
              type: object
              required:
              - sku
              - handling_tags
              - classification_source
              - version
              properties:
                sku:
                  type: string
                  description: The SKU (also the Kafka key and the CloudEvents `subject`).
                handling_tags:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                    - Hazmat
                    - Fragile
                    - TemperatureSensitive
                    - Oversized
                    - HighValue
                  description: Handling tags in stable order. Hazmat and Fragile feed ClassificationInfo; the
                    others are stored but unused here.
                temperature_class:
                  type: string
                  enum:
                  - Ambient
                  - Chilled
                  - Frozen
                  description: Omitted when unset.
                dot_hazard_class:
                  type: integer
                  minimum: 1
                  maximum: 9
                  description: DOT hazard class; omitted when unset. Drives SealPackage's same-package segregation
                    (ADR-0010).
                classification_source:
                  type: string
                  enum:
                  - native
                  - legacy-import
                  description: Migration artefact of product-master (its ADR 0003); not used here.
                version:
                  type: integer
                  minimum: 1
                  format: int64
                  description: Product aggregate version after the change; the local copy's guard.
      examples:
      - name: productClassified
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
        payload:
          specversion: "1.0"
          id: 0f6d8a2b-3c4e-4d5f-8a9b-7c6d5e4f3a2b
          source: /warehouse/product-master
          type: com.warehouse.wms.product-master.product.ProductClassified
          subject: SKU-1
          time: '2026-10-06T21:02:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:product-master:events:ProductClassified:v1
          data:
            sku: SKU-1
            handling_tags:
            - Hazmat
            - TemperatureSensitive
            temperature_class: Frozen
            dot_hazard_class: 3
            classification_source: native
            version: 3
  schemas:
    TransferFactData:
      type: object
      required:
      - transfer_ref
      - work_unit_id
      - task_id
      - work_kind
      description: The payload every transfer fact (TransferPicked / TransferDispatched /
        TransferArrived) carries — the transfer correlation block the completed Task carried,
        stamped at release time.
      properties:
        transfer_ref:
          type: string
          description: The transfer saga's correlation id.
        demand_id:
          type: string
          description: The work-demand reference the release carried; omitted when absent.
        work_unit_id:
          type: string
          description: The completed task's work unit id (its order reference).
        task_id:
          type: string
          description: The completing task id — also the Kafka key and CloudEvents subject.
        work_kind:
          type: string
          enum:
          - TRANSFER_PICK
          - TRANSFER_DISPATCH
          - TRANSFER_ARRIVAL
        site_id:
          type: string
          description: Site the fact is about; omitted when the release carried none.
        sku:
          type: string
          description: SKU the transfer moves; omitted when the release carried none.
        quantity:
          type: integer
          description: Units of sku; omitted when the release carried none.
    KafkaHeaders:
      type: object
      description: Kafka message headers carried by every message.
      required:
      - content-type
      properties:
        content-type:
          type: string
          const: application/cloudevents+json; charset=UTF-8
          description: CloudEvents structured-mode media type.
        traceparent:
          type: string
          description: W3C traceparent of the publishing span.
        tracestate:
          type: string
          description: W3C tracestate, present only when a vendor added entries.
    CloudEvent:
      type: object
      description: CloudEvents 1.0 context attributes; every attribute is required in this fleet.
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - dataschema
      - data
      properties:
        specversion:
          type: string
          const: "1.0"
          description: CloudEvents spec version.
        id:
          type: string
          format: uuid
          description: UUID v4, minted once per occurrence and stable across outbox redelivery.
        source:
          type: string
          format: uri-reference
          description: Producing service, `/warehouse/<repo>`.
        type:
          type: string
          description: '`com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>`.'
        subject:
          type: string
          minLength: 1
          description: Aggregate instance id; equal to the Kafka message key.
        time:
          type: string
          format: date-time
          description: Domain occurred-at, UTC, RFC 3339.
        datacontenttype:
          type: string
          const: application/json
          description: Content type of `data`.
        dataschema:
          type: string
          format: uri
          description: '`urn:warehouse:<repo>:<events|analytics>:<EventName>:v<N>`.'
        data:
          type: object
          description: Event payload (snake_case keys).
