          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.fulfillment-execution.package.PackageManifested
            source:
              type: string
              const: /warehouse/fulfillment-execution
            dataschema:
              type: string
              const: urn:warehouse:fulfillment-execution:events:PackageManifested:v1
            data:
              type: object
              required:
              - package_id
              - order_ref
              properties:
                package_id:
                  type: string
                  description: Manifested package id.
                order_ref:
                  type: string
                  description: The package's order reference.
      examples:
      - name: packageManifested
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
          source: /warehouse/fulfillment-execution
          type: com.warehouse.wes.fulfillment-execution.package.PackageManifested
          subject: pkg-1029
          time: '2026-09-30T15:00:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:fulfillment-execution:events:PackageManifested:v1
          data:
            package_id: pkg-1029
            order_ref: wu-8a1f
    AnalyticsTaskCreated:
      name: AnalyticsTaskCreated
      title: TaskCreated
      summary: Analytics occurrence of TaskCreated for the throughput data product.
      description: A task entered the pool. Published on the internal `warehouse.fulfillment.analytics`
        topic (ADR-0012) and consumed only by this service's own analytics projector (`cmd/fulfillment-projector`).
      contentType: application/cloudevents+json
      tags:
      - name: task
      - name: analytics
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.fulfillment-execution.task.TaskCreated
            source:
              type: string
              const: /warehouse/fulfillment-execution
            dataschema:
              type: string
              const: urn:warehouse:fulfillment-execution:analytics:TaskCreated:v1
            data:
              type: object
              required:
              - task_id
              - task_type
              properties:
                task_id:
                  type: string
                  description: Task id.
                task_type:
                  type: string
                  enum:
                  - ''
                  - PICK
                  - PACK
                  - SLAM
                  - REBIN
                  description: The task's process path, enriched via a TaskRepo lookup; empty when the
                    task cannot be found.
      examples:
      - name: analyticsTaskCreated
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
          source: /warehouse/fulfillment-execution
          type: com.warehouse.wes.fulfillment-execution.task.TaskCreated
          subject: t1
          time: '2026-09-30T15:00:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:fulfillment-execution:analytics:TaskCreated:v1
          data:
            task_id: t1
            task_type: PICK
    AnalyticsTaskClaimed:
      name: AnalyticsTaskClaimed
      title: TaskClaimed
      summary: Analytics occurrence of TaskClaimed for the throughput data product.
      description: A station claimed a task (projects into claims). Published on the internal `warehouse.fulfillment.analytics`
        topic (ADR-0012) and consumed only by this service's own analytics projector (`cmd/fulfillment-projector`).
