    WorkReleased:
      name: WorkReleased
      title: WorkReleased
      summary: Work Planning released a work unit (consumed).
      description: Published by wes-work-planning on `warehouse.work-planning.events`; consumed here to
        create a Task via CreateTask. Dispatch is on the full `type`; dedupe is on the CloudEvents `id`.
        A message that is not a valid CloudEvents 1.0 event is dead-lettered to `warehouse.work-planning.events.dlq`.
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          required:
          - type
          - source
          - dataschema
          - data
          properties:
            type:
              type: string
              const: com.warehouse.wes.work-planning.workunit.WorkReleased
            source:
              type: string
              const: /warehouse/wes-work-planning
            dataschema:
              type: string
              const: urn:warehouse:wes-work-planning:events:WorkReleased:v1
            data:
              type: object
              required:
              - path_id
              - work_unit_id
              - cpt
              properties:
                path_id:
                  type: string
                  description: Process path id, resolved against the process-path catalogue.
                work_unit_id:
                  type: string
                  description: Becomes the Task's order reference.
                cpt:
                  type: string
                  description: CPT deadline.
                  format: date-time
                ref:
                  type: string
                  description: Release reference. For order-originated work this is the order id; it is kept
                    on the Task and published as TaskCompleted.order_ref (ADR-0040). For transfer work it is the demand id.
                line_no:
                  type: integer
                  minimum: 1
                  description: Optional (additive; the event stays v1). The 1-based order line this work
                    unit is for; wes-work-planning sets it for order-originated work (explicitly, not encoded
                    in work_unit_id). It is kept on the Task as source_line_no and published as
                    TaskCompleted.line_no (ADR-0041). Absent from producers that predate it, and never
                    honoured for transfer work.
                fragile:
                  type: boolean
                  description: Optional fragile packing hint (default false).
                gift_wrap:
                  type: boolean
                  description: Optional gift-wrap request (default false).
                transfer_ref:
                  type: string
                  description: Present only for inter-warehouse-transfer work (the transfer saga's
                    correlation id). Its presence turns the created Task into transfer work whose
                    completion publishes exactly one transfer fact.
                work_kind:
                  type: string
                  enum:
                  - TRANSFER_PICK
                  - TRANSFER_DISPATCH
                  - TRANSFER_ARRIVAL
                  description: Kind of transfer work; selects the completion fact. Required whenever
                    transfer_ref is present, unknown values are rejected.
                site_id:
                  type: string
                  description: Site the transfer fact is about (origin for pick/dispatch, destination
                    for arrival).
                sku:
                  type: string
                  description: SKU the transfer moves.
                quantity:
                  type: integer
                  description: Units of sku the transfer moves.
      examples:
      - name: workReleased
        headers:
          content-type: application/cloudevents+json; charset=UTF-8
          traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
        payload:
          specversion: "1.0"
          id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
          source: /warehouse/wes-work-planning
          type: com.warehouse.wes.work-planning.workunit.WorkReleased
          subject: wu-8a1f
          time: '2026-09-30T15:00:00Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:wes-work-planning:events:WorkReleased:v1
          data:
            path_id: pick-zone-a
            work_unit_id: wu-8a1f
            cpt: '2026-09-30T18:00:00Z'
            ref: release-1
            line_no: 2
