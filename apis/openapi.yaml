openapi: 3.0.3
info:
  title: Fulfillment Execution API
  version: "1.0.0"
  description: >
    Fulfillment Execution is the task-lifecycle core bounded context for
    Pick, Pack, and SLAM (Scan, Label, Apply, Manifest). It is downstream of
    Work Planning, which releases work into this service (over Kafka, not
    HTTP — see the repo README's Integration section), and this service in
    turn issues commands to WCS/equipment as physical work is executed.


    The defining design rule is **pull, not push**: a station calls
    `claimNext(stationId, capabilities)` and the system selects the
    highest-priority (earliest CPT — Critical Pull Time) pending
    task the station is certified/equipped for. The system never names a
    station in advance. Assignment is **at-most-once**, enforced by a
    time-boxed **lease**: if a claim is not confirmed (renewed) or completed
    before the lease expires, the task automatically returns to the pool
    rather than vanishing.


    This API's aggregates: **Task** (Pick | Pack | SLAM; Pending ->
    Claimed(leased) -> Completed), **Station** (a work position with a
    capability set, one occupant at a time), and **Package** (Pack path
    output — an order becomes a sealed carton; the SLAM weigh-check applies
    a shipping label or diverts the package on a weight discrepancy beyond
    tolerance). **OrderConsolidation** (Rebin fan-in) gates the pick -> pack
    handoff: an order's PACK task is created only once every required line
    has arrived at Rebin (`POST /rebin/arrivals`).


    **Out of scope / boundary**: this service does not plan or release work
    (that's Work Planning's job — it publishes `WorkReleased`, consumed here
    over Kafka), does not manage inventory reservations (that's
    Inventory Storage), and does not drive physical WCS/equipment directly
    over this API (that's a separate command channel). This API is
    HATEOAS-free by design (Richardson Maturity Level 2 is the target, not
    Level 3) — clients are expected to know the URL structure, not discover
    it via response links.
  contact:
    name: Fulfillment Execution
    url: https://github.com/claudioed/fulfillment-execution
servers:
  - url: http://localhost:8080
    description: Local development (in-memory adapters unless DATABASE_URL is set)

tags:
  - name: Tasks
    description: >
      The Task aggregate: units of Pick, Pack, or SLAM work. Covers the pool
      (create), PULL dispatch (claim-next), lease lifecycle (renew, expire),
      completion, and read models: the pending queue-depth projection and
      the by-order-reference lookup used by downstream consoles.
  - name: Stations
    description: >
      The Station aggregate: a work position with a capability set,
      occupied by at most one worker/robot at a time. Covers registration
      (which also serves as idempotent re-certification), check-in/
      check-out of the occupant (see
      [ADR-0014](/docs/adr/0014-labor-performance-integration-hooks)), and
      is the entry point for PULL dispatch (`claim-next` is a Station
      action).
  - name: Packages
    description: >
      The Package aggregate: Pack-path output. An order's scanned contents
      become a sealed carton (`seal-package`, driven by a Pack task's active
      claim), then the SLAM weigh-check either applies a shipping label or
      diverts the package if the actual weight is outside tolerance of the
      expected weight. Read model: `GET /packages/{id}` and
      `GET /packages?orderRef=` expose a package's current status (and so
      the SLAM outcome) without side effects.
  - name: Rebin
    description: >
      The OrderConsolidation aggregate: the Rebin / put-wall fan-in point
      between Pick and Pack (see
      [ADR-0016](/docs/adr/0016-rebin-and-order-consolidation)). A
      multi-line order picked from different pods produces independent PICK
      completions; each picked line is scanned into the order's
      consolidation slot (`POST /rebin/arrivals`), and the order's PACK task
      is created only once every required line has arrived. This is the
      only path from a completed pick to a PACK task over HTTP.
  - name: System
    description: Operational endpoints not tied to a domain aggregate.

paths:
  /tasks:
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Create a task and place it in the pool
      description: >
        Puts a new unit of Pick, Pack, or SLAM work into the pending pool.
        The task is not assigned to any station at creation time — PULL
        dispatch (`POST /stations/{stationId}/claim-next`) is the only way
        a task becomes claimed, consistent with this service's rule that
        work is never pushed to a named station in advance. `cpt` (Critical
        Pull Time) drives dispatch priority: `claimNext` always
        selects the earliest-CPT pending task a station is equipped for.


        **Idempotent per `Idempotency-Key` (ADR-0028).** Send a
        caller-chosen `Idempotency-Key` header on every call. The first
        request with a given key creates the task; a retry with the same
        key and the same body replays the stored response verbatim (same
        status, headers and task id — including a cached 4xx) instead of
        creating a duplicate. Reusing a key with a different body is
        rejected with `422 idempotency-key-reused`; omitting the header is
        `400 idempotency-key-required`. (Key enforcement requires the
        Postgres-backed deployment; the in-memory development
        configuration skips it.) Without a repeated key every call creates
        a new task with a fresh, server-generated id.
      parameters:
        - name: Idempotency-Key
          in: header
          # Declared optional in the schema because enforcement is
          # deployment-dependent: with Postgres (every real deployment) a
          # missing key is 400 idempotency-key-required; the in-memory
          # development/contract-test configuration has no idempotency store
          # and ignores the header. Clients MUST always send it.
          required: false
          description: >
            Caller-supplied unique key (e.g. a UUID) identifying this
            creation attempt. **Clients must always send a non-empty key**: a
            Postgres-backed deployment rejects a missing key with `400
            idempotency-key-required` (the in-memory development
            configuration ignores the header, which is why the schema marks
            it optional). Retries of the same logical request must reuse it;
            a genuinely different request must use a new one.
          schema:
            type: string
            example: 6f1c2a3e-9b1d-4c1a-8f0e-2d5b7c9a1e44
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            example:
              type: PICK
              cpt: "2026-01-01T18:00:00Z"
              orderRef: order-42
              requiredCapabilities: [pick]
              fragile: false
      responses:
        "201":
          description: >
            Task created and placed in the pending pool (or, on a retry
            with a repeated `Idempotency-Key` and identical body, the
            original response replayed).
          headers:
            Location:
              description: Path of the newly created task, e.g. `/tasks/{id}`.
              schema:
                type: string
                example: /tasks/20260101T120000.000000000
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
              example:
                id: 20260101T120000.000000000
                type: PICK
                status: PENDING
                cpt: "2026-01-01T18:00:00Z"
                orderRef: order-42
                requiredCapabilities: [pick]
                fragile: false
        "400":
          description: >
            The `Idempotency-Key` header is missing
            (`idempotency-key-required`), or the request body is
            malformed JSON, a required field is missing or empty, or a
            field value is invalid (e.g. a task type outside the TaskType
            enum) (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                keyRequired:
                  summary: Missing Idempotency-Key header
                  value:
                    type: https://errors.fulfillment-execution.warehouse-systems.dev/idempotency-key-required
                    title: Idempotency-Key header is required
                    status: 400
                    detail: This endpoint creates a new resource on every call and requires a caller-supplied Idempotency-Key header so a retried request is never applied twice.
                    instance: /tasks
                invalidRequest:
                  summary: Invalid body
                  value:
                    type: https://errors.fulfillment-execution.warehouse-systems.dev/invalid-request
                    title: The request is malformed or missing a required field
                    status: 400
                    detail: type must be one of PICK, PACK, SLAM, REBIN, DISPATCH, ARRIVAL, DISPATCH, ARRIVAL
        "422":
          description: >
            The `Idempotency-Key` was already used with a request that had
            a different body (`idempotency-key-reused`). Use a new key for
            a genuinely different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/idempotency-key-reused
                title: Idempotency-Key was already used with a different request
                status: 422
                detail: The Idempotency-Key header on this request was already used with a request that had a different body. Use a new Idempotency-Key for a genuinely different request.
                instance: /tasks
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: getTasksByOrderRef
      tags: [Tasks]
      summary: Look up every task recorded for an order reference
      description: >
        Read-only query tracing an order-management order back to the
        Pick/Pack/SLAM tasks this service created for it — the endpoint
        that backs a cross-service console screen answering "what tasks
        has fulfillment-execution created/completed for order X". Returns
        every task whose `orderRef` matches, normally one PICK/PACK/SLAM
        leg each; a leg may appear more than once if it was retried (e.g.
        a new task created after a prior one's lease expired without
        completion), so treat the response as the full set of tasks for
        the order, not a single result per process path. An unrecognized
        `orderRef` is not an error — it returns an empty array, the same
        convention `GET /queues/{taskType}/depth` uses for an unknown
        `taskType`.
      parameters:
        - name: orderRef
          in: query
          required: true
          description: >
            The order reference to look up (Task.orderRef, set at creation).
            Must be non-empty — an empty value is treated as a missing
            parameter and rejected with 400.
          schema:
            type: string
            minLength: 1
            example: order-42
      responses:
        "200":
          description: Every task recorded for `orderRef` (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"
              example:
                - id: 20260101T120000.000000000
                  type: PICK
                  status: COMPLETED
                  cpt: "2026-01-01T18:00:00Z"
                  orderRef: order-42
                  requiredCapabilities: [pick]
                  fragile: false
                  giftWrap: false
                - id: 20260101T120100.000000000
                  type: PACK
                  status: PENDING
                  cpt: "2026-01-01T19:00:00Z"
                  orderRef: order-42
                  requiredCapabilities: [pack]
                  fragile: false
                  giftWrap: false
        "400":
          description: The required `orderRef` query parameter is missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/invalid-request
                title: The request is malformed or missing a required field
                status: 400
                detail: orderRef is required
                instance: /tasks
        "500":
          $ref: "#/components/responses/InternalError"

  /stations:
    post:
      operationId: registerStation
      tags: [Stations]
      summary: Register or re-register a station
      description: >
        Creates a station with the given capability set, or — if `stationId`
        already exists — replaces its capability set (e.g. recertifying a
        station for a new capability). This is deliberately idempotent by
        client-supplied id: re-registering the same `stationId` upserts
        rather than erroring or duplicating, which is what closes the
        pull-dispatch gap for HTTP-only smoke testing (without this
        endpoint there is no way to create a station over HTTP, so
        `claim-next` against a freshly started server always 404s).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterStationRequest"
            example:
              stationId: station-1
              capabilities: [pick]
      responses:
        "201":
          description: Station registered (or its capability set updated).
          headers:
            Location:
              description: Path of the registered station, e.g. `/stations/{id}`.
              schema:
                type: string
                example: /stations/station-1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationResponse"
              example:
                id: station-1
                capabilities: [pick]
                occupied: false
        "400":
          $ref: "#/components/responses/BadRequestNoInstance"
        "422":
          description: >
            The supplied locationCode is KNOWN (per facility-layout) to
            resolve to a role other than WorkCenter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/station-location-not-workcenter
                title: Station's locationCode does not resolve to a facility-layout WorkCenter
                status: 422
                detail: "usecases: station location does not resolve to a WorkCenter"
        "500":
          $ref: "#/components/responses/InternalError"

  /stations/{stationId}/claim-next:
    post:
      operationId: claimNextTask
      tags: [Stations, Tasks]
      summary: PULL-dispatch the best-fit pending task to this station
      description: >
        Implements this service's core dispatch rule: **pull, not push**.
        The station calls claimNext; the system — never the caller — selects
        which task to hand it. Among Pending tasks of `taskType` that this
        station's registered capabilities satisfy, the **earliest-CPT** task
        is selected and leased to `stationId` for a fixed duration (5
        minutes by default). Assignment is **at-most-once**: a task with an
        active, unexpired lease cannot be claimed by anyone else, and this
        endpoint will simply skip it and try the next-best candidate. If the
        lease is not renewed or the task completed before it expires, the
        task automatically returns to the pool (see
        `POST /tasks/expire-leases`) rather than being lost. This call is
        not idempotent in the way a PUT would be — every successful call
        claims a *different* task (or the same task again only after its
        prior lease was released); that's intended PULL semantics, not a
        bug.
      parameters:
        - name: stationId
          in: path
          required: true
          description: The station pulling work, e.g. as registered via `POST /stations`.
          schema:
            type: string
            example: station-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimNextRequest"
            example:
              taskType: PICK
      responses:
        "200":
          description: The best-fit pending task was found and leased to this station.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
              example:
                id: 20260101T120000.000000000
                type: PICK
                status: CLAIMED
                cpt: "2026-01-01T18:00:00Z"
                orderRef: order-42
                requiredCapabilities: [pick]
                fragile: false
                leaseStationId: station-1
                leaseExpiry: "2026-01-01T12:05:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No station is registered with this `stationId`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/station-not-found
                title: Station not found
                status: 404
                detail: "usecases: station not found"
                instance: /stations/station-1/claim-next
        "409":
          description: >
            No pending task of `taskType` exists that this station's
            capabilities satisfy right now — the pool has nothing to
            offer, not a transient error. Safe to retry later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/no-claimable-task
                title: No claimable task for station capabilities
                status: 409
                detail: "usecases: no claimable task for station capabilities"
                instance: /stations/station-1/claim-next
        "500":
          $ref: "#/components/responses/InternalError"

  /stations/{stationId}/check-in:
    post:
      operationId: checkInStation
      tags: [Stations]
      summary: Check a worker or robot into a station
      description: >
        Assigns an occupant to a station — the Station aggregate's
        `CheckIn` invariant enforced through the application layer: one
        occupant at a time. This is operational state, not a
        labor-performance domain event in its own right (see
        [ADR-0014](/docs/adr/0014-labor-performance-integration-hooks)):
        no domain event is published by this endpoint. The checked-in
        occupant is instead surfaced, best-effort, as `associateId` on the
        `TaskCompleted` Kafka event when a task claimed by this station is
        later completed.
      parameters:
        - name: stationId
          in: path
          required: true
          description: The station id, as returned by `POST /stations`.
          schema:
            type: string
            example: station-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInStationRequest"
            example:
              occupantId: worker-42
      responses:
        "200":
          description: Station checked in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationResponse"
              example:
                id: station-1
                capabilities: [pick]
                occupied: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No station is registered with this `stationId`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/station-not-found
                title: Station not found
                status: 404
                detail: "usecases: station not found"
                instance: /stations/station-1/check-in
        "409":
          description: The station already has an occupant checked in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/station-occupied
                title: Station is already occupied
                status: 409
                detail: "station: already occupied"
                instance: /stations/station-1/check-in
        "500":
          $ref: "#/components/responses/InternalError"

  /stations/{stationId}/check-out:
    post:
      operationId: checkOutStation
      tags: [Stations]
      summary: Check the current occupant out of a station
      description: >
        Clears a station's occupant — the Station aggregate's `CheckOut`
        invariant enforced through the application layer. Takes no request
        body. Like check-in, this publishes no domain event (see
        [ADR-0014](/docs/adr/0014-labor-performance-integration-hooks)).
      parameters:
        - name: stationId
          in: path
          required: true
          description: The station id.
          schema:
            type: string
            example: station-1
      responses:
        "200":
          description: Station checked out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationResponse"
              example:
                id: station-1
                capabilities: [pick]
                occupied: false
        "404":
          description: No station is registered with this `stationId`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/station-not-found
                title: Station not found
                status: 404
                detail: "usecases: station not found"
                instance: /stations/station-1/check-out
        "409":
          description: The station has no occupant checked in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/station-not-occupied
                title: Station is not occupied
                status: 409
                detail: "station: not occupied"
                instance: /stations/station-1/check-out
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{id}/renew-lease:
    post:
      operationId: renewLease
      tags: [Tasks]
      summary: Extend the active lease held by the claiming station
      description: >
        Pushes out a task's lease expiry so a station still actively working
        it doesn't lose the claim to the automatic expiry sweep
        (`POST /tasks/expire-leases`). Only the station that currently owns
        the claim may renew it. Idempotent in effect: repeated calls simply
        keep extending the same lease.
      parameters:
        - name: id
          in: path
          required: true
          description: The task id, as returned by `POST /tasks` or a claim-next response.
          schema:
            type: string
            example: 20260101T120000.000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewLeaseRequest"
            example:
              stationId: station-1
      responses:
        "204":
          description: Lease renewed. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No task exists with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/task-not-found
                title: Task not found
                status: 404
                detail: "usecases: task not found"
                instance: /tasks/20260101T120000.000000000/renew-lease
        "409":
          description: >
            The task has no active claim to renew (never claimed, its lease
            already expired, or it was already completed), or `stationId`
            does not own the active claim.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/task-not-claimed
                title: Task is not currently claimed
                status: 409
                detail: "task: not claimed"
                instance: /tasks/20260101T120000.000000000/renew-lease
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [Tasks]
      summary: Complete a task on behalf of the station that claimed it
      description: >
        Finishes the task's lifecycle (Claimed -> Completed) and publishes
        `TaskCompleted`. Only the owning station's claim may complete it,
        and a completed task can never be completed again — this endpoint
        enforces the no-double-complete invariant, returning `409` on a
        repeat call rather than silently succeeding twice.
      parameters:
        - name: id
          in: path
          required: true
          description: The task id.
          schema:
            type: string
            example: 20260101T120000.000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
            example:
              stationId: station-1
      responses:
        "204":
          description: Task completed. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No task exists with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/task-not-found
                title: Task not found
                status: 404
                detail: "usecases: task not found"
                instance: /tasks/20260101T120000.000000000/complete
        "409":
          description: >
            The task was already completed (double-complete, rejected), has
            no active claim, or `stationId` does not own the active claim.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/task-already-completed
                title: Task already completed
                status: 409
                detail: "task: already completed"
                instance: /tasks/20260101T120000.000000000/complete
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{id}/seal-package:
    post:
      operationId: sealPackage
      tags: [Tasks, Packages]
      summary: Scan contents and seal a Package for a Pack task's order
      description: >
        The Pack-path counterpart to `complete`: the station holding the
        active claim on a Pack task scans the order's contents and seals
        them into a brand-new Package resource (created by this call, not
        pre-existing — see the `Location` header). The task itself is left
        claimed; a separate `POST /tasks/{id}/complete` call finishes the
        Pack task once the package is sealed. Requires at least one scanned
        item — an empty `contents` array is a domain invariant violation
        (`422`), not a malformed request (`400`), since the array is present
        and well-formed, just semantically insufficient to seal.
      parameters:
        - name: id
          in: path
          required: true
          description: The Pack task id whose active claim authorizes this seal.
          schema:
            type: string
            example: 20260101T120100.000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SealPackageRequest"
            example:
              stationId: station-2
              contents: [sku-1, sku-2]
      responses:
        "201":
          description: Package sealed.
          headers:
            Location:
              description: Path of the newly created package, e.g. `/packages/{id}`.
              schema:
                type: string
                example: /packages/20260101T120200.000000000
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageResponse"
              example:
                id: 20260101T120200.000000000
                orderRef: order-42
                status: SEALED
                scannedContents: [sku-1, sku-2]
                fragileHandling: false
                sortLane: STANDARD
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No task exists with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/task-not-found
                title: Task not found
                status: 404
                detail: "usecases: task not found"
                instance: /tasks/20260101T120100.000000000/seal-package
        "409":
          description: >
            One of: `stationId` has no active claim on this task — it was
            never claimed, or the lease has expired, whichever station held it
            (`task-not-claimed`, the same type `complete` and `renew-lease`
            return for that condition; [ADR-0038](/docs/adr/0038-seal-package-expired-lease-is-not-claimed));
            an ACTIVE lease on the task is held by a different station
            (`task-not-owner`); or a scanned item's live DOT
            hazard classification lookup found it incompatible — per the
            class-level 49 CFR §177.848-derived segregation matrix — with an
            item already scanned into this same package
            (`package-segregation-violation`, see
            [ADR-0010](/docs/adr/0010-package-segregation-and-sort-lane)).
            The segregation check only runs when the deployment has
            `PRODUCT_CLASSIFICATION_MODE=http` configured; the default
            permissive mode never rejects on this basis.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/task-not-owner
                title: Station does not own the active claim on this task
                status: 409
                detail: "task: station does not own the claim"
                instance: /tasks/20260101T120100.000000000/seal-package
        "422":
          description: >
            The task is not a Pack task, or `contents` was empty (nothing
            was scanned, so there is nothing to seal).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/package-no-scanned-contents
                title: Cannot seal a package without scanned contents
                status: 422
                detail: "package: cannot seal without scanned contents"
                instance: /tasks/20260101T120100.000000000/seal-package
        "500":
          $ref: "#/components/responses/InternalError"

  /packages:
    get:
      operationId: getPackagesByOrderRef
      tags: [Packages]
      summary: Look up every Package sealed for an order reference
      description: >
        Read-only query returning every Package sealed for `orderRef` — the
        Package-side twin of `GET /tasks?orderRef=` (same query-parameter
        contract, same 400 on a missing or empty `orderRef`, same empty
        array for an unrecognized one). An order normally yields one carton,
        but a multi-carton order or a re-pack after a SLAM diversion yields
        several, so treat the response as a set. Ordered by package id.
        Side-effect-free (see
        [ADR-0033](/docs/adr/0033-package-read-model)).
      parameters:
        - name: orderRef
          in: query
          required: true
          description: >
            The order reference to look up (Package.orderRef, copied from
            the owning Pack task at seal time). Must be non-empty — an empty
            value is treated as a missing parameter and rejected with 400.
          schema:
            type: string
            minLength: 1
            example: order-42
      responses:
        "200":
          description: Every Package sealed for `orderRef` (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageResponse"
              example:
                - id: 20260101T120200.000000000
                  orderRef: order-42
                  status: LABELED
                  scannedContents: [sku-1, sku-2]
                  fragileHandling: false
                  giftWrapRequested: false
                  sortLane: STANDARD
        "400":
          description: The required `orderRef` query parameter is missing or empty.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/invalid-request
                title: The request is malformed or missing a required field
                status: 400
                detail: orderRef is required
                instance: /packages
        "500":
          $ref: "#/components/responses/InternalError"

  /packages/{id}:
    get:
      operationId: getPackage
      tags: [Packages]
      summary: Read one Package, including its SLAM outcome
      description: >
        Read-only view of a single Package, in exactly the shape
        `POST /tasks/{id}/seal-package` returns on 201. This is how the SLAM
        operator and the outbound dock loader learn the SLAM outcome:
        `POST /packages/{id}/slam` answers `204` both when a label was
        applied and when the package was diverted, so read `status` here —
        `LABELED` means the carton goes to the truck by its `sortLane`,
        `DIVERTED` means it goes to problem-solve. Side-effect-free (see
        [ADR-0033](/docs/adr/0033-package-read-model)).
      parameters:
        - name: id
          in: path
          required: true
          description: The package id, as returned by `POST /tasks/{id}/seal-package`.
          schema:
            type: string
            example: 20260101T120200.000000000
      responses:
        "200":
          description: The package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageResponse"
              example:
                id: 20260101T120200.000000000
                orderRef: order-42
                status: DIVERTED
                scannedContents: [sku-1, sku-2]
                fragileHandling: false
                giftWrapRequested: false
                sortLane: STANDARD
        "404":
          description: No package exists with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/package-not-found
                title: Package not found
                status: 404
                detail: "usecases: package not found"
                instance: /packages/20260101T120200.000000000
        "500":
          $ref: "#/components/responses/InternalError"

  /packages/{id}/slam:
    post:
      operationId: runSlam
      tags: [Packages]
      summary: Run the SLAM weigh-check on a sealed package
      description: >
        SLAM = Scan, Label, Apply, Manifest. Weighs a sealed package: if
        `|actualWeight - expectedWeight|` is within tolerance (0.05, same
        unit as the two weights — e.g. kilograms), a shipping label is
        applied (`LabelApplied`); otherwise the package is diverted
        (`WeightDiscrepancyDetected` + `PackageDiverted`) rather than
        shipped with a wrong manifest. Idempotent in effect once processed:
        a repeat call on an already-labeled-or-diverted package returns
        `409` rather than re-processing it.
      parameters:
        - name: id
          in: path
          required: true
          description: The package id, as returned by `POST /tasks/{id}/seal-package`.
          schema:
            type: string
            example: 20260101T120200.000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunSlamRequest"
            example:
              actualWeight: 2.02
              expectedWeight: 2.0
      responses:
        "204":
          description: >
            Weigh-check recorded (label applied or the package diverted —
            both are successful outcomes of this call). No response body;
            read `GET /packages/{id}` afterwards to see which outcome
            occurred (`status` `LABELED` or `DIVERTED`, see
            [ADR-0033](/docs/adr/0033-package-read-model)).
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No package exists with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/package-not-found
                title: Package not found
                status: 404
                detail: "usecases: package not found"
                instance: /packages/20260101T120200.000000000/slam
        "409":
          description: The package already had a label applied or was already diverted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/package-already-processed
                title: Package SLAM already processed
                status: 409
                detail: "package: SLAM already processed"
                instance: /packages/20260101T120200.000000000/slam
        "422":
          description: The package has not been sealed yet (still Open).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/package-not-sealed
                title: Package must be sealed before SLAM
                status: 422
                detail: "package: must be sealed before SLAM"
                instance: /packages/20260101T120200.000000000/slam
        "500":
          $ref: "#/components/responses/InternalError"

  /queues/{taskType}/depth:
    get:
      operationId: getQueueDepth
      tags: [Tasks]
      summary: Read the pending-task count for a process path (read model)
      description: >
        A projection, not a live domain query: returns how many tasks of
        `taskType` currently sit Pending (not yet claimed) in the pool.
        Read-only — this endpoint never mutates state. An unrecognized
        `taskType` is not an error; it simply has a depth of `0`, since
        this is a count over existing tasks rather than a lookup against a
        fixed enum the server enforces.
      parameters:
        - name: taskType
          in: path
          required: true
          description: The process path to count (conventionally PICK, PACK, or SLAM).
          schema:
            type: string
            example: PICK
      responses:
        "200":
          description: Current pending-task count for `taskType`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDepthResponse"
              example:
                taskType: PICK
                depth: 3
        "500":
          $ref: "#/components/responses/InternalError"

  /capacity/{capability}:
    get:
      operationId: getInstalledCapacity
      tags: [Stations]
      summary: Read how many registered stations hold a given capability (read model)
      description: >
        A projection over the Station registry, not a staffing count: returns
        how many currently-registered stations hold `capability`, regardless
        of occupancy. This is the raw installed ceiling a process path can
        ever be staffed up to — workforce-management's CommitShiftPlan calls
        this endpoint to enforce `plannedHeads` against reality, live,
        instead of trusting a caller-supplied installed-station count alone
        (see this repo's ADR-0018). Read-only — never mutates state. An
        unrecognized `capability` is not an error; it simply has an
        installed count of `0`, the same "count over existing rows, not a
        lookup against a fixed enum" contract `getQueueDepth` already uses.
      parameters:
        - name: capability
          in: path
          required: true
          description: The capability to count registered stations for (e.g. pick, pack, slam, rebin).
          schema:
            type: string
            example: pick
      responses:
        "200":
          description: Current count of registered stations holding `capability`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledCapacityResponse"
              example:
                capability: pick
                installed: 4
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/expire-leases:
    post:
      operationId: expireLeases
      tags: [Tasks]
      summary: Sweep every Claimed task whose lease has expired back to Pending
      description: >
        The Clock-driven side of the at-most-once lease design: scans every
        Claimed task and, for each whose lease expiry has passed without a
        renewal or completion, frees it back to Pending (publishing
        `LeaseExpired`) so the work is never silently lost. A collection-
        level action on the `tasks` resource — not scoped to a single task
        id — analogous to how `/tasks/{id}/complete` is a single-resource
        action; deliberately not placed under an unscoped `/admin` path.
        Idempotent: a second call simply frees nothing new if nothing else
        has expired since the last sweep. Takes no request body.
      responses:
        "200":
          description: Sweep completed; body reports how many tasks were freed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpireLeasesResponse"
              example:
                freed: 2
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/sweep-cpt-misses:
    post:
      operationId: sweepCPTMisses
      tags: [Tasks]
      summary: Sweep every still-open task whose CPT has passed and report it as missed
      description: >
        The Clock-driven half of the promise feedback loop with
        order-management (ADR 0014 §5, this service's own ADR-0025): scans
        every task still open (Pending or Claimed — i.e. not Completed) and,
        for each whose CPT is at or before now, publishes `TaskCPTMissed`.
        Unlike `/tasks/expire-leases`, this never mutates the task's own
        lifecycle state — a CPT miss is a fact reported upstream, not a
        state transition. A collection-level action on the `tasks`
        resource, mirroring `/tasks/expire-leases`'s own convention exactly.
        **Not idempotent in the usual sense by design**: a task still open
        past its CPT is reported again on every sweep pass for as long as
        it remains open — order-management's `RepromiseOrder` consumer is
        explicitly designed (ADR 0014 §5) to be idempotent on
        `(orderId, sourceEventId)` because of this. Takes no request body.
      responses:
        "200":
          description: Sweep completed; body reports how many tasks were reported as CPT-missed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SweepCPTMissesResponse"
              example:
                reported: 1
        "500":
          $ref: "#/components/responses/InternalError"

  /rebin/arrivals:
    post:
      operationId: arriveAtRebin
      tags: [Rebin]
      summary: Record one picked line arriving at the order's Rebin consolidation slot
      description: >
        A Rebin / put-wall associate (or automation signal) scans one picked
        line of an order into that order's consolidation slot. This is the
        pick -> pack handoff of
        [ADR-0016](/docs/adr/0016-rebin-and-order-consolidation): once every
        required line of the order has arrived, this call creates the
        order's PACK task (through the same `CreateTask` use case as
        `POST /tasks`, so it appears in `GET /tasks?orderRef=` and is
        claimable via `claim-next` with `taskType: PACK`) and raises
        `OrderConsolidated`. Every accepted arrival raises
        `ItemArrivedAtRebin`. Neither event is forwarded to Kafka today.


        **The first call for an `orderRef` fixes the required line set.**
        The first arrival seen for an `orderRef` creates its consolidation
        tracker with that call's `requiredLineIds` as the full, fixed set.
        Every later call for the same `orderRef` must still send
        `requiredLineIds` (it is validated as required on every call, since
        only the caller knows whether an arrival is the first), but the
        value is ignored once the set exists — the caller is responsible for
        sending the same set each time. `lineId` must be a member of the
        fixed set, otherwise the call is rejected with `422`
        `rebin-unknown-line` (this includes a first call whose `lineId` is
        not in its own `requiredLineIds`).


        **Idempotent per (`orderRef`, `lineId`).** Re-sending an arrival for
        a line that has already arrived is a no-op success (`204`), so a
        redelivered scan never errors and never double-counts.


        **The PACK task is created exactly once**, by the arrival that
        completes the set; it takes `packCpt`, `packRequiredCapabilities`,
        `packFragile` and `packGiftWrap` from that completing call. Any
        later arrival for an already-consolidated order is a `204` no-op
        and creates no further PACK task. A single-line order
        (`requiredLineIds` of length 1, `lineId` equal to it) completes on
        its first arrival, creating the PACK task immediately.


        No response body on success. Not guarded by an `Idempotency-Key`
        header (ADR-0028): the natural (`orderRef`, `lineId`) key already
        makes retries safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArriveAtRebinRequest"
            example:
              orderRef: order-42
              lineId: line-1
              requiredLineIds: [line-1, line-2]
              packCpt: "2026-01-01T19:00:00Z"
              packRequiredCapabilities: [pack]
              packFragile: false
              packGiftWrap: false
      responses:
        "204":
          description: >
            Arrival recorded (or was already recorded — an idempotent
            redelivery). If this arrival completed the order's required
            line set, the order's PACK task has been created. No response
            body.
        "400":
          $ref: "#/components/responses/BadRequestNoInstance"
        "422":
          description: >
            `lineId` is not part of this order's required consolidation
            set — the set fixed by the first arrival seen for `orderRef`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://errors.fulfillment-execution.warehouse-systems.dev/rebin-unknown-line
                title: Line is not part of this order's required consolidation set
                status: 422
                detail: "consolidation: line is not part of this order"
                instance: /rebin/arrivals
        "500":
          $ref: "#/components/responses/InternalError"

  /healthz:
    get:
      operationId: getHealthz
      tags: [System]
      summary: Liveness check
      description: >
        Returns `200` if the HTTP server process is up and serving. This is
        a liveness probe, not a readiness probe — it does not check
        connectivity to Postgres or Kafka, and always returns `200` with no
        body as long as the process can handle the request at all.
      responses:
        "200":
          description: The service process is up.

  /readyz:
    get:
      operationId: getReadyz
      tags: [System]
      summary: Readiness check
      description: >
        Returns `200 {"status":"ready"}` while the service is ready to
        accept new traffic, and `503 {"status":"not_ready"}` once graceful
        shutdown has begun (ADR-0029) — the readiness gate is flipped as
        the FIRST step of shutdown, before the HTTP server stops accepting
        connections, so a Kubernetes readinessProbe pointed here has a
        window to stop routing new traffic before the listener closes.
        Distinct from `/healthz` (liveness, never flipped by shutdown).
      responses:
        "200":
          description: The service is ready to accept new traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
              example:
                status: ready
        "503":
          description: The service has begun graceful shutdown and is no longer accepting new traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [not_ready]
              example:
                status: not_ready

components:
  schemas:
    Problem:
      type: object
      description: >
        RFC 7807 (Problem Details for HTTP APIs) error response, used for
        every error this API returns. See
        https://www.rfc-editor.org/rfc/rfc7807.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          description: >
            A URI identifying the error category. Does not need to resolve
            to a real page — it is an identifier, unique per distinct error
            category in this service.
          example: https://errors.fulfillment-execution.warehouse-systems.dev/task-not-found
        title:
          type: string
          description: Fixed, category-level human-readable summary.
          example: Task not found
        status:
          type: integer
          format: int32
          description: Duplicates the HTTP status code, per RFC 7807.
          example: 404
        detail:
          type: string
          description: The specific error message for this occurrence.
          example: "usecases: task not found"
        instance:
          type: string
          description: >
            The request path that produced the error. Omitted for a
            validation error on a bare collection-create endpoint
            (`POST /tasks`, `POST /stations`, `POST /rebin/arrivals`) whose
            path has no segment identifying a specific resource.
          example: /tasks/20260101T120000.000000000/renew-lease

    TaskType:
      type: string
      description: >
        The process path a task belongs to. REBIN tasks are not creatable
        through `POST /tasks` by HTTP-only callers in practice — they arrive
        via the WorkReleased Kafka event's rebin path (see the process-path
        catalogue) — but they exist in the task store and therefore appear
        in read-model responses alongside PICK/PACK/SLAM.
      enum: [PICK, PACK, SLAM, REBIN, DISPATCH, ARRIVAL]
      example: PICK

    TaskStatus:
      type: string
      description: Lifecycle state of a Task.
      enum: [PENDING, CLAIMED, COMPLETED]
      example: PENDING

    PackageStatus:
      type: string
      description: Lifecycle state of a Package.
      enum: [OPEN, SEALED, LABELED, DIVERTED]
      example: SEALED

    SortLane:
      type: string
      description: >
        Package's derived WES-tier sortation routing decision (see
        [ADR-0010](/docs/adr/0010-package-segregation-and-sort-lane)):
        `HAZMAT_LANE` if any scanned item carried a DOT hazard class from
        the live per-scanned-item classification lookup, else
        `FRAGILE_NO_TILT` if `fragileHandling` is true, else `STANDARD`.
        A decision only — no WCS device/conveyor integration exists in
        this service; a real WCS system would consume this value as its
        own inbound fact.
      enum: [HAZMAT_LANE, FRAGILE_NO_TILT, STANDARD]
      example: STANDARD

    CreateTaskRequest:
      type: object
      required: [type, cpt, orderRef, requiredCapabilities]
      properties:
        type:
          $ref: "#/components/schemas/TaskType"
        cpt:
          type: string
          format: date-time
          description: >
            Critical Pull Time — the deadline driving dispatch
            priority. `claimNext` always selects the earliest-CPT pending
            task a station qualifies for.
          example: "2026-01-01T18:00:00Z"
        orderRef:
          type: string
          minLength: 1
          description: >
            The originating order/work-unit reference (opaque to this
            service). Must be non-empty: the API treats "" as a missing
            field and rejects it with 400.
          example: order-42
        requiredCapabilities:
          type: array
          description: >
            Capabilities a claiming station's capability set must be a
            superset of. This is an open, freeform list of strings, not a
            closed enum — known values in active use include `pick`,
            `pack`, `slam`, and `hazmat` (hazmat is matched by the same
            generic capability-set mechanism as any other value; no special
            handling exists or is needed for it).
          minItems: 1
          items:
            type: string
            nullable: true
            description: >
              A null item is accepted and treated as an empty capability
              string (Go's JSON decoding cannot distinguish them).
            example: pick
        fragile:
          type: boolean
          nullable: true
          default: false
          description: >
            A packing hint, not a placement or capability-matching signal:
            true if this task's upstream order line was classified Fragile
            by inventory-storage's ProductClassification concept, as
            stamped onto the WorkReleased event by wes-work-planning at
            release time. Optional and defaults to false for backward
            compatibility with any producer that predates this field; an
            explicit null is accepted and treated the same as omission
            (false).
      example:
        type: PICK
        cpt: "2026-01-01T18:00:00Z"
        orderRef: order-42
        requiredCapabilities: [pick]
        fragile: false

    TaskResponse:
      type: object
      properties:
        id:
          type: string
          description: Server-generated task id.
          example: 20260101T120000.000000000
        type:
          $ref: "#/components/schemas/TaskType"
        status:
          $ref: "#/components/schemas/TaskStatus"
        cpt:
          type: string
          format: date-time
          example: "2026-01-01T18:00:00Z"
        orderRef:
          type: string
          example: order-42
        requiredCapabilities:
          type: array
          items:
            type: string
          example: [pick]
        fragile:
          type: boolean
          description: >
            Packing hint carried from task creation — see
            CreateTaskRequest.fragile. Does not affect claiming.
          example: false
        giftWrap:
          type: boolean
          description: >
            Read-only packing hint: true if this task's order was flagged
            for gift wrap at work-enqueue time. Unlike fragile, it has no
            HTTP ingestion path — it arrives only via
            WorkReleased.data.gift_wrap (see ADR-0011) and cannot be set
            through POST /tasks. Does not affect claiming or capability
            matching.
          example: false
        leaseStationId:
          type: string
          nullable: true
          description: The station currently holding the active claim, if any.
          example: station-1
        leaseExpiry:
          type: string
          format: date-time
          nullable: true
          description: When the active claim's lease expires, if any.
          example: "2026-01-01T12:05:00Z"

    ClaimNextRequest:
      type: object
      required: [taskType]
      properties:
        taskType:
          $ref: "#/components/schemas/TaskType"
      example:
        taskType: PICK

    RenewLeaseRequest:
      type: object
      required: [stationId]
      properties:
        stationId:
          type: string
          minLength: 1
          description: >
            Must match the station that currently owns the active claim.
            Must be non-empty: the API treats "" as a missing field and
            rejects it with 400.
          example: station-1
      example:
        stationId: station-1

    CompleteTaskRequest:
      type: object
      required: [stationId]
      properties:
        stationId:
          type: string
          minLength: 1
          description: >
            Must match the station that currently owns the active claim.
            Must be non-empty: the API treats "" as a missing field and
            rejects it with 400.
          example: station-1
      example:
        stationId: station-1

    SealPackageRequest:
      type: object
      required: [stationId]
      properties:
        stationId:
          type: string
          minLength: 1
          description: >
            Must match the station that currently owns the active claim on
            the Pack task. Must be non-empty: the API treats "" as a
            missing field and rejects it with 400.
          example: station-2
        contents:
          type: array
          description: >
            SKUs scanned for this package. An empty or omitted array is
            accepted by request validation (it's well-formed JSON) but
            rejected by the domain with a 422, since sealing requires at
            least one scanned item.
          items:
            type: string
            nullable: true
            description: >
              A null item is accepted and treated as an empty SKU string
              (Go's JSON decoding cannot distinguish them).
            example: sku-1
      example:
        stationId: station-2
        contents: [sku-1, sku-2]

    PackageResponse:
      type: object
      properties:
        id:
          type: string
          description: Server-generated package id.
          example: 20260101T120200.000000000
        orderRef:
          type: string
          example: order-42
        status:
          $ref: "#/components/schemas/PackageStatus"
        scannedContents:
          type: array
          items:
            type: string
          example: [sku-1, sku-2]
        fragileHandling:
          type: boolean
          description: >
            Derived at seal time from the owning Pack task's `fragile`
            flag (not an independent input to seal-package) — true if any
            of the package's scanned/sealed contents came from an order
            line classified Fragile upstream.
          example: false
        giftWrapRequested:
          type: boolean
          description: >
            Derived at seal time from the owning Pack task's `giftWrap`
            flag (not an independent input to seal-package, and not
            restated by the station) — true if the order this package
            fulfils was flagged for gift wrap at work-enqueue time. Unlike
            hazmat, this is a packing concern only: it does not gate which
            station may fulfil the order (see ADR-0011).
          example: false
        sortLane:
          $ref: "#/components/schemas/SortLane"

    RunSlamRequest:
      type: object
      required: [actualWeight, expectedWeight]
      properties:
        actualWeight:
          type: number
          format: double
          nullable: true
          description: >
            Measured weight from the SLAM scale, in the same unit as
            expectedWeight (e.g. kilograms). An explicit null is accepted
            and treated the same as 0 (Go's JSON decoding cannot
            distinguish them).
          example: 2.02
        expectedWeight:
          type: number
          format: double
          nullable: true
          description: >
            Expected weight for this order's contents, in the same unit as
            actualWeight. An explicit null is accepted and treated the same
            as 0 (Go's JSON decoding cannot distinguish them).
          example: 2.0
      example:
        actualWeight: 2.02
        expectedWeight: 2.0

    QueueDepthResponse:
      type: object
      properties:
        taskType:
          type: string
          example: PICK
        depth:
          type: integer
          format: int32
          description: Count of currently Pending tasks of this type.
          example: 3

    InstalledCapacityResponse:
      type: object
      properties:
        capability:
          type: string
          example: pick
        installed:
          type: integer
          format: int32
          description: Count of currently-registered stations holding this capability, regardless of occupancy.
          example: 4

    ExpireLeasesResponse:
      type: object
      properties:
        freed:
          type: integer
          format: int32
          description: Count of tasks freed back to Pending by this sweep.
          example: 2

    SweepCPTMissesResponse:
      type: object
      properties:
        reported:
          type: integer
          format: int32
          description: Count of tasks reported as CPT-missed (TaskCPTMissed raised) by this sweep pass.
          example: 1

    RegisterStationRequest:
      type: object
      required: [stationId, capabilities]
      properties:
        stationId:
          type: string
          minLength: 1
          description: >
            Client-supplied station identifier; re-using an existing one
            upserts capabilities. Must be non-empty: the API treats "" as a
            missing field and rejects it with 400.
          example: station-1
        capabilities:
          type: array
          minItems: 1
          items:
            type: string
            nullable: true
            description: >
              A null item is accepted and treated as an empty capability
              string (Go's JSON decoding cannot distinguish them).
            example: pick
        locationCode:
          type: string
          nullable: true
          description: >
            Optional facility-layout LocationCode identifying where this
            station physically sits (ADR-0024). Omitted entirely — or an
            explicit null, which is treated exactly the same — means
            unchecked: no role validation is attempted. When supplied
            and the location-role lookup is configured, a LocationCode
            that KNOWINGLY resolves to a role other than WorkCenter is
            rejected (422); an unrecognized LocationCode, or an
            unavailable lookup, fails open and is recorded unchecked.
          example: WH1-STOR-AMB-A07-01-01-A
      example:
        stationId: station-1
        capabilities: [pick]

    StationResponse:
      type: object
      properties:
        id:
          type: string
          example: station-1
        capabilities:
          type: array
          items:
            type: string
          example: [pick]
        occupied:
          type: boolean
          description: Whether the station currently has an occupant checked in.
          example: false
        locationCode:
          type: string
          description: >
            Omitted entirely (not defaulted to "") when the station has
            no recorded locationCode (ADR-0024).
          example: WH1-STOR-AMB-A07-01-01-A

    CheckInStationRequest:
      type: object
      required: [occupantId]
      properties:
        occupantId:
          type: string
          minLength: 1
          description: >
            Identifies the worker or robot checking in. Opaque to this
            service — carried through to the `associateId` field of a
            later `TaskCompleted` Kafka event for any task this station
            completes while the occupant remains checked in (see
            [ADR-0014](/docs/adr/0014-labor-performance-integration-hooks)).
            Must be non-empty: the API treats "" as a missing field and
            rejects it with 400.
          example: worker-42
      example:
        occupantId: worker-42

    ArriveAtRebinRequest:
      type: object
      required: [orderRef, lineId, requiredLineIds, packCpt, packRequiredCapabilities]
      properties:
        orderRef:
          type: string
          minLength: 1
          description: >
            The order whose lines are being consolidated; also stamped as
            the resulting PACK task's `orderRef`. Must be non-empty: the API
            treats "" as a missing field and rejects it with 400.
          example: order-42
        lineId:
          type: string
          minLength: 1
          description: >
            The line arriving at Rebin with this call. Must be a member of
            the order's required line set (else 422 `rebin-unknown-line`).
            Must be non-empty: the API treats "" as a missing field and
            rejects it with 400.
          example: line-1
        requiredLineIds:
          type: array
          minItems: 1
          description: >
            Every line id the order needs before it can be packed. Required
            and non-empty on every call, but only the FIRST call for an
            `orderRef` uses it — it fixes the order's required set, and later
            calls' values are ignored (send the same set each time).
          items:
            type: string
            nullable: true
            description: >
              A null item is accepted and treated as an empty line id
              string (Go's JSON decoding cannot distinguish them).
            example: line-1
          example: [line-1, line-2]
        packCpt:
          type: string
          format: date-time
          description: >
            Critical Pull Time for the PACK task this order's
            consolidation creates. Used only by the arrival that completes
            the set.
          example: "2026-01-01T19:00:00Z"
        packRequiredCapabilities:
          type: array
          minItems: 1
          description: >
            Capabilities a station must hold to claim the resulting PACK
            task (open, freeform list — see
            CreateTaskRequest.requiredCapabilities). Required and non-empty
            on every call; used only by the arrival that completes the set.
          items:
            type: string
            nullable: true
            description: >
              A null item is accepted and treated as an empty capability
              string (Go's JSON decoding cannot distinguish them).
            example: pack
          example: [pack]
        packFragile:
          type: boolean
          nullable: true
          default: false
          description: >
            Packing hint carried onto the resulting PACK task's `fragile`.
            Optional; omission and an explicit null both mean false.
          example: false
        packGiftWrap:
          type: boolean
          nullable: true
          default: false
          description: >
            Packing hint carried onto the resulting PACK task's `giftWrap`.
            Optional; omission and an explicit null both mean false.
          example: false
      example:
        orderRef: order-42
        lineId: line-1
        requiredLineIds: [line-1, line-2]
        packCpt: "2026-01-01T19:00:00Z"
        packRequiredCapabilities: [pack]
        packFragile: false
        packGiftWrap: false

  responses:
    BadRequest:
      description: >
        The request body is malformed JSON, a required field is missing or
        empty, or a field value is invalid (e.g. a task type outside the
        TaskType enum).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://errors.fulfillment-execution.warehouse-systems.dev/invalid-request
            title: The request is malformed or missing a required field
            status: 400
            detail: stationId is required
            instance: /tasks/20260101T120000.000000000/complete

    BadRequestNoInstance:
      description: >
        The request body is malformed JSON, a required field is missing or
        empty, or a field value is invalid (e.g. a task type outside the
        TaskType enum). `instance` is omitted: this is a bare
        collection-create endpoint with no path segment identifying a
        specific resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://errors.fulfillment-execution.warehouse-systems.dev/invalid-request
            title: The request is malformed or missing a required field
            status: 400
            detail: type must be one of PICK, PACK, SLAM, REBIN, DISPATCH, ARRIVAL

    InternalError:
      description: An unexpected server-side failure (e.g. a repository or event-publisher error).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://errors.fulfillment-execution.warehouse-systems.dev/internal-error
            title: Internal server error
            status: 500
            detail: "pgx: connection refused"
